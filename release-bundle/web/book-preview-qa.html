<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="newsroom-v04.css"><link rel="stylesheet" href="newsroom-v05.css"><link rel="stylesheet" href="newsroom-v06.css"><link rel="stylesheet" href="editorial-polish.css"><link rel="stylesheet" href="reader-layout.css"><link rel="stylesheet" href="feature-gallery-2026.css"><link rel="stylesheet" href="year-checklist-2026.css"><link rel="stylesheet" href="korean-editorial-2026.css"><link rel="stylesheet" href="book-layout-2026.css"><main id="main" class="newsroom-main"><h1>웅비 2026 A4 · 공개 자료 배치 검증</h1><p>프리뷰 전용 · 공개 기사만 사용 · 제출/저장/로그인 없음</p><div id="result">지면을 구성하고 있습니다…</div></main><script src="js/book-source-2026.js"></script><script src="js/book-layout-2026.js"></script><script id="source" type="application/json">[{"id": "narasarang-humanities-20261017", "title": "바다에서는 쓰레기를 줍고, 수도산에서는 역사를 만났다", "deck": "제2회 나라사랑 지역 인문학 기행 — 호미곶 해양 플로깅에서 학도의용군 전승기념관까지, 포항고 학생들이 걸으며 만난 우리 지역의 어제와 오늘.", "body": "바닷가로 떠나는 여행이라고 하면 흔히 풍경을 감상하거나 사진을 찍는 모습을 떠올린다. 하지만 이번에는 조금 달랐다. 학생들의 손에는 쓰레기봉투와 집게가 들려 있었다.\n\n지난 10월 17일 토요일, 포항고등학교 1·2학년 학생들은 ‘제2회 나라사랑 지역 인문학 기행’에 참가했다. 오전에는 호미곶에서 해양 플로깅 활동을 하고, 오후에는 포항의 학도의용군 전승기념관과 전승탑 일원을 탐방했다.\n\n바다를 깨끗하게 만드는 일과 전쟁의 역사를 배우는 일. 처음에는 별개의 활동처럼 보이지만, 두 장소를 거치면서 이번 기행의 주제가 조금씩 분명해졌다.\n\n## 호미곶, 바다를 보는 대신 바다를 살피다\n\n첫 번째 목적지는 호미곶이었다.\n\n푸른 바다와 탁 트인 하늘이 먼저 눈에 들어왔지만, 학생들이 살펴야 할 곳은 멀리 있는 수평선만이 아니었다. 바위 사이와 해안가 주변을 걸으며 버려진 쓰레기를 찾아 수거하는 해양 플로깅 활동이 시작됐다.\n\n평소에는 그냥 지나쳤을 작은 쓰레기도 직접 줍기 시작하니 다르게 보였다. 바다를 깨끗하게 유지하는 일이 누군가의 특별한 봉사활동이 아니라 우리 모두의 일상과 연결되어 있다는 사실을 확인하는 시간이었다.\n\n현장에서는 호미곶파출소의 협조로 해양 안전에 관한 교육도 이루어졌다. 학생들은 구명조끼 착용 방법과 응급상황 대처를 익히고, 해양 사고가 발생했을 때 어떻게 대응해야 하는지 배웠다. 직접 해 보는 실습에서는 해안을 지키는 일에 안전을 생각하는 태도가 빠질 수 없다는 점을 실감할 수 있었다.\n\n## 우리가 사는 도시에도 전쟁의 흔적이 있다\n\n점심 식사를 마친 학생들은 포항 시내로 이동했다. 오후에는 수도산의 학도의용군 전승기념관과 전승탑을 찾았다. 역사 교과서에서는 6·25전쟁 당시의 전선을 지도와 연표로 배운다. 이번에는 그 지도 위의 포항을 직접 걸으며 어떤 일이 있었는지 살펴볼 차례였다.\n\n기념관 안쪽에는 당시의 사진과 전투 기록이 전시되어 있었다. 1950년 여름, 북한군의 남진으로 동해안 방어가 급박해지면서 포항 시내도 전투의 현장이 되었다. 당시 포항여자중학교(현재 포항여고)에는 국군 제3사단의 후방사령부가 있었고, 8월 11일 북한군이 이곳으로 진입하면서 치열한 전투가 벌어졌다. '낙동강 방어선'이라는 교과서 속 표현이 포항의 구체적인 장소와 연결되는 대목이다.\n\n전시 사진을 보며 생각해 볼 것은 군대가 어느 방향으로 이동했는지만이 아니다. '왜 학교가 전투의 장소가 되었을까', '당시 이 지역의 학생과 주민은 무엇을 겪었을까' 같은 질문으로 탐구를 넓힐 수 있다. 날짜와 지명을 외우던 역사 공부가 사진과 기록을 읽으며 당시 사람들의 처지를 살피는 일로 이어지는 것이다.\n\n1950년 8월 11일 포항여중 전투에서는 학도의용군 48명이 전사했다. 그 가운데 서울 동성중학교에 다니던 열일곱 살 이우근도 있었다. 전사한 그의 주머니에서는 어머니에게 남긴 글이 발견됐다. 전쟁의 피해를 숫자로만 바라보기 어려운 이유가 여기에 있다. 오늘의 고등학생과 비슷한 나이의 누군가가 그날의 두려움과 그리움을 직접 글로 남겼다.\n\n학도의용군의 저항은 포항 주민들이 철수할 시간을 확보하는 데에도 도움이 됐다는 기록이 전해진다. 전투의 의미를 살필 때 희생된 학도병뿐 아니라 피란길에 올라야 했던 사람들도 함께 생각할 필요가 있다. 누가 어떤 기록을 남겼는지, 그 기록으로 무엇을 알 수 있고 무엇을 더 찾아봐야 하는지 질문하는 태도가 역사 탐구의 다음 단계다.\n\n전시관을 둘러본 뒤 학생들은 전승탑 일원에서 기념사진을 남겼다. 사진 속 웃고 있는 학생들의 모습은 전시실의 흑백사진과 자연스럽게 대비됐다. 수십 년 전 이곳을 지나간 학생들의 이야기를 오늘의 우리가 배우는 이유도 여기에 있을 것이다. 역사는 멀리 떨어진 사건만이 아니라 지금 우리가 사는 도시의 장소에도 남아 있었다.\n\n## 바다를 지키는 일, 역사를 기억하는 일\n\n오전에는 바위 틈을 살피며 쓰레기를 주웠고, 오후에는 전시관에서 오래된 사진과 기록을 살폈다. 몸을 움직이는 봉사활동과 조용히 역사를 돌아보는 탐방이 하루 일정 안에서 이어진 셈이다.\n\n이번 기행은 포항을 멀리 있는 관광지가 아니라 우리가 생활하는 지역으로 다시 바라볼 기회였다. 늘 가까이에 있지만 관심을 기울이지 않았던 바다, 그리고 같은 도시에 있으면서도 잘 알지 못했던 역사적 장소를 직접 찾아갔다는 데 의미가 있었다.\n\n집으로 돌아오는 길, 호미곶에서 보았던 풍경과 전승기념관의 사진들이 서로 다른 장면으로 남았을 것이다. 하지만 그 두 장소에는 공통점이 있다.\n\n우리가 살아가는 곳을 아끼고, 그곳에 남은 이야기를 잊지 않는 일이다.\n\n이번 기행에서 학생들이 걸었던 길은 바로 그 두 가지를 함께 생각해 볼 수 있는 길이었다.", "byline": "웅비 편집실", "year": 2026, "status": "approved", "category": "특집", "photos": [{"id": "history-98", "sourceAsset": "assets/feature-20261017/h-098.webp", "webPath": "assets/feature-20261017/h-098.webp", "originalPath": "assets/feature-20261017/h-098.webp", "caption": "호미곶에서 시작한 인문학 기행, 해양환경과 지역사를 함께 배우는 하루의 첫 장면.", "alt": "호미곶에서 출발 전 단체사진", "after": -1, "placeholder": false, "sample": false, "credit": "포항고등학교 인문사회부"}, {"id": "history-100", "sourceAsset": "assets/feature-20261017/h-100.webp", "webPath": "a re-20261017/h-011.webp", "webPath": "assets/feature-20261017/h-011.webp", "originalPath": "assets/feature-20261017/h-011.webp", "caption": "학도의용군 전승기념관 앞 단체사진", "alt": "학도의용군 전승기념관 앞 단체사진", "after": -1, "placeholder": false, "sample": false, "credit": "포항고등학교 인문사회부", "galleryPhase": "수도산 · 학도의용군 역사 탐방"}, {"id": "history-26", "sourceAsset": "assets/feature-20261017/h-026.webp", "webPath": "assets/feature-20261017/h-026.webp", "originalPath": "assets/feature-20261017/h-026.webp", "caption": "전승기념관에서 전해지는 역사를 듣는 학생들", "alt": "전승기념관에서 전해지는 역사를 듣는 학생들", "after": -1, "placeholder": false, "sample": false, "credit": "포항고등학교 인문사회부", "galleryPhase": "수도산 · 학도의용군 역사 탐방"}], "publishedAt": "2026-10-18T11:30:00+09:00"}, {"id": "economic-financial-literacy-2026", "title": "교과서에서 배운 경제, 게임판을 지나 한국 경제의 질문으로", "deck": "포항고 1학기 경제·금융 체험교육과 한국은행 포항본부 초청 청소년 경제교육 — 동아리 시간에 이어진 경제 개념과 탐구의 연결", "body": "경제가 어렵게 느껴지는 이유는 어쩌면 단어보다 거리 때문일지 모른다. 물가나 경기변동은 뉴스에서 자주 듣지만, 정작 내 생활과 어떻게 연결되는지는 쉽게 떠오르지 않는다. 포항고등학교 학생들은 올해 1학기 경제·금융 체험교육과 한국은행 초청 특강을 이어 가며 그 거리를 조금씩 좁혔다.\n\n4월과 5월에는 친구들과 모둠을 이루어 게임 속 선택을 직접 해 봤고, 6월 10일에는 한국은행 포항본부의 경제교육을 통해 한국 경제를 더 넓은 시야에서 바라봤다. 종이 위에서 배운 개념이 게임판을 지나 실제 사회의 질문으로 이어진 것이다.\n\n## 첫 번째 교실, 선택을 직접 해 보는 경제\n\n봄에 진행된 학교 연계 경제·금융 프로그램은 경상북도청소년활동진흥센터가 마련한 체험 중심 교육이었다. 고등학생 과정은 자산관리, 실험경제학, 포트폴리오 투자, 재무제표 등 경제·금융을 여러 각도에서 살피도록 구성됐다.\n\n4월 22일과 5월 6일의 사진에는 학생들이 모둠별로 둘러앉아 게임판을 들여다보는 모습이 남아 있다. 주사위를 굴리고, 기록을 확인하고, 계산기를 두드리면서 각자 다음 선택을 고민했다. 평소 교과서에서 읽던 ‘합리적인 선택’이라는 표현이 이때는 꽤 구체적인 고민이 됐다.\n\n게임판에서 중요한 것은 무조건 많은 돈을 얻는 일이 아니었다. 가진 자원을 어디에 쓸지, 눈앞의 이익과 이후의 위험을 어떻게 비교할지, 같은 조건에서 왜 서로 다른 판단이 나오는지를 직접 경험하는 과정이었다.\n\n## 답 하나보다 더 중요한 건 판단의 이유\n\n모둠 활동에서는 생각이 쉽게 일치하지 않는다. 누군가는 모험적인 투자를 제안하고, 누군가는 당장의 지출을 줄이려 한다. 모두에게 똑같은 상황이 주어져도 선택이 달라지는 모습을 보며, 경제적 의사결정에는 계산뿐 아니라 정보와 토론이 필요하다는 사실을 생각해 볼 수 있었다.\n\n특히 경제·금융 교육의 목표는 게임에서 이기는 데 그치지 않는다. 어떤 선택을 했고 그 이유는 무엇이었는지 돌아보는 일, 실패한 판단에서도 배울 점을 찾는 일이 더 중요하다. 학생들이 함께 고민하고 의견을 나눈 시간은 경제를 외우는 공부에서 벗어나게 했다.\n\n## 두 번째 교실, 한국은행이 들려준 한국 경제 이야기\n\n6월 10일 동아리 시간에는 한국은행 포항본부의 청소년 경제교육 특강이 이어졌다. 한국은행 포항본부에서 방문한 강사는 학생들을 대상으로 경제 현상을 설명했고, 학생들은 강의 자료를 살펴보며 수업 시간에 배운 내용을 더 넓은 사회 문제와 연결했다.\n\n당일 촬영된 강의 화면에는 ‘세계경제와 한국’이라는 제목이 등장한다. 우리의 소비와 저축을 넘어 한국 경제가 세계의 변화와 어떻게 맞물리는지 살펴보는 시간이었다. 경제 뉴스에서 자주 접하는 물가와 경기변동 같은 말도 이제는 단순한 암기 대상만은 아니었다.\n\n학생들은 한국 경제 전반에 관한 설명을 들으며 궁금한 점을 질문하고, 교과에서 다룬 개념이 현실에서 어떤 의미를 갖는지 탐구하는 시간을 가졌다. 경제를 이해한다는 것은 용어를 많이 아는 것뿐 아니라 그 용어로 오늘의 사회를 읽어 내는 일이라는 점을 확인할 수 있었다.\n\n## 게임판의 선택과 나라 경제를 잇는 질문\n\n4월과 5월의 경제교육이 ‘나라면 어떻게 선택할까’를 직접 해 보는 시간이었다면, 6월의 한국은행 특강은 ‘그 선택들이 모여 사회에 어떤 변화를 만들까’를 생각하는 시간에 가까웠다.\n\n가까운 곳에서 시작해 먼 곳으로 시선을 넓힌 두 교육은 서로 다른 방식으로 연결됐다. 학교 수업의 개념, 친구들과의 체험, 전문가의 설명이 차례로 겹치면서 학생들은 경제를 나와 무관한 숫자가 아닌 삶의 문제로 바라볼 수 있었다.\n\n특강이 끝난 뒤에도 답은 하나가 아니다. 금리가 변하면 누구에게 어떤 영향이 생길까. 같은 경제 현상을 두고 사람들은 왜 다르게 판단할까. 앞으로 뉴스를 읽을 때는 이런 질문을 조금 더 구체적으로 던져 볼 수 있을 것이다.\n\n**우리가 배운 경제는 시험지에만 머물지 않았다.** 친구들과 머리를 맞댄 게임판에도, 한국 경제를 설명하는 강의 화면에도, 그 이후 각자 이어 갈 질문에도 남았다.", "byline": "웅비 편집실", "year": 2026, "status": "approved", "category": "특집", "photos": [{"id": "finance-spring-20260506_153320", "sourceAsset": "assets/feature-economy-2026/20260506_153320.webp", "webPath": "assets/feature-economy-2026/20260506_153320.webp", "originalPath": "assets/feature-economy-2026/20260506_153320.webp", "caption": "모둠별 보드게임을 통해 돈을 어떻게 사용하고 관리할지 직접 판단해 보는 경제 수업.", "alt": "모둠별로 경제 보드게임을 체험하는 학생들", "after": -1, "placeholder": false, "sample": false, "credit": "포항고등학교 인문사회부"}, {"id": "finance-spring-20260422_143745", "sourceAsset": "assets/feature-economy-2026/20260422_143745.webp", "webPath": "assets/feature-economy-2026/20260422_143745.webp", "originalPath": "assets/feature-economy-2026/20260422_143745.webp", "caption": "4월 22일 강사의 안내를 들으며 게임과 체험을 통해 경제 원리를 익히는 시간을 가졌다.", "alt": "체험 활동의 목표와 방법을 듣는 학생들", "after": 4, "placeholder": false, "sample": false, "credit": "포항고등학교 인문사회부"}, {"id": "finance-spring-20260506_153304", "sourceAsset": "assets/feature-economy-2026/20260506_153304.webp", "webPath": "assets/feature-economy-2026/20260506_153304.webp", "o eholder": false, "sample": false, "credit": "포항고등학교 인문사회부"}, {"id": "economy-20", "sourceAsset": "assets/feature-economy-2026/b-020.webp", "webPath": "assets/feature-economy-2026/b-020.webp", "originalPath": "assets/feature-economy-2026/b-020.webp", "caption": "강사의 설명을 들으며 경제 개념을 정리하는 학생들", "alt": "강사의 설명을 들으며 경제 개념을 정리하는 학생들", "after": -1, "placeholder": false, "sample": false, "credit": "포항고등학교 인문사회부"}, {"id": "economy-17", "sourceAsset": "assets/feature-economy-2026/b-017.webp", "webPath": "assets/feature-economy-2026/b-017.webp", "originalPath": "assets/feature-economy-2026/b-017.webp", "caption": "경제 강의를 듣고 자료를 살펴보는 학생들", "alt": "경제 강의를 듣고 자료를 살펴보는 학생들", "after": -1, "placeholder": false, "sample": false, "credit": "포항고등학교 인문사회부"}, {"id": "economy-11", "sourceAsset": "assets/feature-economy-2026/b-011.webp", "webPath": "assets/feature-economy-2026/b-011.webp", "originalPath": "assets/feature-economy-2026/b-011.webp", "caption": "한국 경제 관련 발표 화면을 살펴보는 시간", "alt": "한국 경제 관련 발표 화면을 살펴보는 시간", "after": -1, "placeholder": false, "sample": false, "credit": "포항고등학교 인문사회부"}, {"id": "economy-24", "sourceAsset": "assets/feature-economy-2026/b-024.webp", "webPath": "assets/feature-economy-2026/b-024.webp", "originalPath": "assets/feature-economy-2026/b-024.webp", "caption": "교과에서 배운 내용을 사회 현상과 연결해 살피는 학생들", "alt": "교과에서 배운 내용을 사회 현상과 연결해 살피는 학생들", "after": -1, "placeholder": false, "sample": false, "credit": "포항고등학교 인문사회부"}, {"id": "economy-15", "sourceAsset": "assets/feature-economy-2026/b-015.webp", "webPath": "assets/feature-economy-2026/b-015.webp", "originalPath": "assets/feature-economy-2026/b-015.webp", "caption": "강의 화면을 보며 경제 질문을 생각해 보는 시간", "alt": "강의 화면을 보며 경제 질문을 생각해 보는 시간", "after": -1, "placeholder": false, "sample": false, "credit": "포항고등학교 인문사회부"}], "publishedAt": "2026-10-18T12:50:00+09:00"}, {"id": "narasarang-history-goldenbell-20260513", "title": "정답 하나를 쓰는 동안, 우리 지역의 역사가 가까워졌다", "deck": "포항고 1·2학년 174명이 함께한 2026 나라사랑 역사골든벨 — 경북 독립운동사와 호국보훈의 의미를 질문하고 기억한 하루", "body": "체육관에 모인 학생들의 손에서 답안판이 올라갔다. 같은 문제를 보고도 누군가는 곧바로 답을 적었고, 누군가는 마지막 순간까지 생각했다. 그날의 역사 수업에는 교과서 대신 커다란 무대가 있었고, 시험지 대신 각자의 답안판이 있었다.\n\n지난 5월 13일 포항고등학교 체육관에서 열린 ‘나라사랑 역사골든벨’에는 1·2학년 학생 174명이 참가했다. 경상북도호국보훈재단과 연계해 진행한 이번 행사는 한국사와 경북 독립운동사, 호국보훈의 의미를 퀴즈로 다시 만나는 자리였다. 우리가 사는 지역에도 기억해야 할 역사가 있다는 사실을 더 가까이서 알아보자는 취지였다.\n\n참가 학생들은 대회 전 배부된 학습 자료를 살펴보며 한국사와 근현대사, 경북 지역의 독립운동가와 역사적 장소에 관한 내용을 준비했다. 단어 하나를 외우는 일에서 시작했지만, 그 이름이 남겨진 장소와 시대를 떠올리면 문제의 무게도 조금씩 달라진다.\n\n## 답안판을 들 때마다 가까워진 지역의 역사\n\n현장에서는 국가 상징과 독립운동, 한국사를 아우르는 30여 문항이 출제됐다. 지역의 독립운동가와 주요 사건을 묻는 문제도 등장했다. 잘 아는 내용이라고 생각해도 막상 정답을 직접 적으려면 잠깐 망설이게 된다. 그 짧은 시간에 수업에서 배운 장면과 기억해 둔 연표를 다시 떠올리게 된다.\n\n학생들은 문제를 읽고 답안판에 정답을 적었다. 답안이 동시에 들리는 순간, 같은 문제를 두고도 서로 다른 선택이 보였다. 어떤 문제를 맞혔는지도 중요했지만, 틀린 문제를 통해 왜 그렇게 생각했는지 돌아볼 수 있다는 점도 이번 퀴즈의 재미였다.\n\n특히 경북의 독립운동을 다룬 문항에서는 ‘어디에서 어떤 일이 일어났는가’라는 질문이 더 가까이 다가온다. 교과서에서 멀게 느껴지던 역사가 우리 지역 사람들의 선택과 삶으로 읽히기 때문이다. 답을 알고 지나치는 것보다 그 답이 가리키는 인물과 장소를 한 번 더 찾아보는 일이 오래 남을 수 있다.\n\n## 마지막 문제, 그리고 최종 골든벨\n\n문제가 이어지면서 참가자들의 도전은 결선으로 향했다. 체육관 앞 무대와 참가 학생들의 시선이 한곳으로 모였고, 정답을 적는 시간은 더욱 진지해졌다. 무대에 끝까지 남는 일은 물론 멋지지만, 그 자리에 이르기까지 스스로 공부하고 도전한 시간도 대회에서 빼놓을 수 없다.\n\n마지막 단계에 오른 2학년 차민혁 학생은 진재서 교장이 직접 출제한 최종 문제를 맞혀 골든벨을 울렸다. 학교 보도자료에 실린 소감에서 차민혁 학생은 “우리 지역에도 나라가 어려웠던 시기에 헌신하신 분들이 많았다는 사실을 알게 되어 자부심을 느꼈다”고 밝혔다. 우승의 기쁨과 함께 역사를 기억하는 이유를 다시 생각했다는 이야기였다.\n\n무대 위의 순간은 사진으로 남는다. 그러나 골든벨을 울린 한 사람의 모습만이 그날의 전부는 아니다. 체육관에서 끝까지 문제를 읽고, 아는 답을 적고, 틀린 문제를 기억해 두었던 다른 참가자들의 시간도 함께 있었다.\n\n## 정답보다 오래 남는 질문\n\n행사 뒤에는 무대 밖에서 도운 학생들의 역할도 눈에 들어온다. 문장정원, 로스쿨, J-ROTC를 비롯한 교내 17개 동아리 학생들이 기획 지원과 질서 유지에 참여했고, 지도교사들도 함께 행사를 운영했다. 대회를 만든 것은 문제를 출제한 사람만이 아니라 그날의 자리를 지킨 학교 구성원 모두였다.\n\n역사골든벨은 정답을 맞히는 행사이지만, 그 답에 이르는 과정은 다른 배움이 될 수 있다. 학생들에게 낯선 독립운동가의 이름이 다음에는 익숙한 지역의 이야기로 떠오를 수도 있다. 왜 그 시대 사람들이 독립을 위해 힘썼는지, 어떤 장소에 그 흔적이 남았는지 스스로 질문하는 일도 중요하다.\n\n끝나고 돌아보니 하루 동안 적은 답안들은 한 장의 점수표로만 정리할 수 없다는 생각이 든다. 정답과 오답 사이에는 우리가 어디에 살고 있고 어떤 역사를 이어받았는지 생각하게 되는 순간이 있었다. 나라사랑이라는 말이 조금 크게 느껴질 때도 있지만, 우리 고장의 역사를 알고 잊지 않으려는 마음에서 시작할 수도 있을 것이다.\n\n체육관을 채운 174명의 도전은 그렇게 한 사람의 우승을 넘어, 포항고 학생들이 우리 지역의 역사를 함께 배우고 기억한 하루로 남았다.", "byline": "웅비 편집실", "year": 2026, "status": "approved", "category": "특집", "photos": [{"id": "goldenbell-20260513-20", "sourceAsset": "assets/feature-goldenbell-2026/g-20.webp", "webPath": "assets/feature-goldenbell-2026/g-20.webp", "originalPath": "assets/feature-goldenbell-2026/g-20.webp", "caption": "174명이 참여한 나라사랑 역사골든벨. 학생들이 답안판을 들어 올린 장면에서 함께 역사를 배우는 분위기가 드러난다. 답안판에 적힌 O·X에서는 같은 문제를 두고 서로 다른 답을 고른 모습도 보인다.", "alt": "174명이 참여한 나라사랑 역사골든벨", "after": -1, "credit": "포항고등학교", "placeholder": false, "sample": false}, {"id": "goldenbell-20260513-37", "sourceAsset": "assets/feature-goldenbell-2026/g-37.webp", "webPath": "assets/feature-goldenbell-2026/g-37.webp", "originalPath": "assets/feature-goldenbell-2026/g-37.webp", "caption": "체육관에 모여 대회를 준비하는 학생들. 평소 교실에서 배운 한국사를 지역 역사와 연결해 보는 시간이었다.", "alt": "체육관에 모여 대회를 준비하는 학생들", "after": 1, "credit": "포항고등학교", "placeholder": false, "sample": false}, {"id": "goldenbell-20260513-27", "sourceAsset": "assets/feature-goldenbell-2026/g-27.webp", "webPath": "assets/feature-goldenbell-2026/g-27.webp", "originalPath": "assets/feature-goldenbell-2026/g-27.webp", "caption": "각자의 답을 적고 생각을 가다듬는 순간. 알고 있다고 생각한 역사도 직접 설명하려면 한 번 더 돌아보게 된다.", "alt": "각자의 답을 적고 생각을 가다듬는 순간", "after": 4, "credit": "포항고등학교", "placeholder": false, "sample": false}, {"id": "goldenbell-20260513-22", "sourceAsset": "assets/feature-goldenbell-2026/g-22.webp", "webPath": "assets/feature-goldenbell-2026/g-22.webp", "originalPath": "assets/feature-goldenbell-2026/g-22.webp", "caption": "화면에 제시되는 문제를 살펴보는 학생들. 한 문제씩 풀면서 국가 상징과 우리 고장의 역사에 다가갔다.", "alt": "화면에 제시되는 문제를 살펴보는 학생들", "after": 5, "credit": "포항고등학교", "placeholder": false, "sample": false}, {"id": "goldenbell-20260513-18", "sourceAsset": "assets/feature-goldenbell-2026/g-18.webp", "webPath": "assets/feature-goldenbell-2026/g-18.webp", "originalPath": "assets/feature-goldenbell-2026/g-18.webp", "caption": "체육관 바닥에 앉아 함께 역사 문제를 푸는 학생들. 퀴즈는 개인의 .webp", "originalPath": "assets/feature-goldenbell-2026/g-23.webp", "caption": "무대 앞 참가자들이 문제를 듣고 답을 적는 모습.", "alt": "무대 앞 참가자들이 문제를 듣고 답을 적는 모습", "after": -1, "credit": "포항고등학교", "placeholder": false, "sample": false, "galleryPhase": "생각하고 답하다"}, {"id": "goldenbell-20260513-17", "sourceAsset": "assets/feature-goldenbell-2026/g-17.webp", "webPath": "assets/feature-goldenbell-2026/g-17.webp", "originalPath": "assets/feature-goldenbell-2026/g-17.webp", "caption": "무대에서 이어진 대회 후반부의 문제 풀이.", "alt": "무대에서 이어진 대회 후반부의 문제 풀이", "after": -1, "credit": "포항고등학교", "placeholder": false, "sample": false, "galleryPhase": "결선과 마무리"}, {"id": "goldenbell-20260513-15", "sourceAsset": "assets/feature-goldenbell-2026/g-15.webp", "webPath": "assets/feature-goldenbell-2026/g-15.webp", "originalPath": "assets/feature-goldenbell-2026/g-15.webp", "caption": "역사골든벨 후반 진행을 지켜보는 학생들.", "alt": "역사골든벨 후반 진행을 지켜보는 학생들", "after": -1, "credit": "포항고등학교", "placeholder": false, "sample": false, "galleryPhase": "결선과 마무리"}, {"id": "goldenbell-20260513-08", "sourceAsset": "assets/feature-goldenbell-2026/g-08.webp", "webPath": "assets/feature-goldenbell-2026/g-08.webp", "originalPath": "assets/feature-goldenbell-2026/g-08.webp", "caption": "시상 순서에 함께한 학생들과 관계자들.", "alt": "시상 순서에 함께한 학생들과 관계자들", "after": -1, "credit": "포항고등학교", "placeholder": false, "sample": false, "galleryPhase": "결선과 마무리"}, {"id": "goldenbell-20260513-05", "sourceAsset": "assets/feature-goldenbell-2026/g-05.webp", "webPath": "assets/feature-goldenbell-2026/g-05.webp", "originalPath": "assets/feature-goldenbell-2026/g-05.webp", "caption": "행사 종료를 앞두고 무대에 모인 참가자들.", "alt": "행사 종료를 앞두고 무대에 모인 참가자들", "after": -1, "credit": "포항고등학교", "placeholder": false, "sample": false, "galleryPhase": "결선과 마무리"}], "publishedAt": "2026-10-18T16:00:00+09:00"}, {"id": "contrib-64f6c32d-392a-466d-8a80-638c8500e875", "title": "해변을 걷고, 오래된 돌 앞에 서다", "deck": "1학기 나라사랑 지역 인문학 기행, 장사리에서 냉수리와 문성리까지", "body": "장사리 해변에서는 모래사장을 따라 학생들의 대열이 이어졌다. 냉수리의 비각 앞에서는 한 학생이 마이크를 착용하고 손에 든 자료를 살폈다. 문성리에서는 큰 돌 곁에 모인 친구들이 현장 설명을 들었다. 같은 날의 장면이지만, 각각의 장소가 과거를 전하는 방식은 달랐다.\n\n2026년 6월 13일 포항고등학교 학생들이 참여한 제1회 나라사랑 지역 인문학 기행은 장사상륙작전 전승기념공원에서 냉수리 신라비와 고분군, 문성리 고인돌로 이어졌다. 이번 기행을 관통하는 질문은 ‘어디를 다녀왔는가’에서 더 나아간다. 바다와 비석, 무덤을 통해 우리는 과거의 무엇을 알 수 있을까.\n\n## 장사리 해안, 풍경에 겹쳐 읽는 전쟁의 기억\n\n학생들은 장사리 일대에서 호국길 걷기에 참여했다. 해안을 따라 걷는 길에서는 선박 형태의 기념시설이 보였다. 하늘에는 블랙이글스의 편대비행이 펼쳐졌고, 지상에서는 체험 부스에 참여하는 학생들의 모습도 이어졌다. 다양한 행사 장면 가운데 이곳의 장소성을 설명하는 출발점은 장사상륙작전이다.\n\n장사상륙작전전승기념관의 설명에 따르면, 1950년 9월 14일 장사해안에 상륙한 부대는 학도병을 중심으로 구성된 독립 제1유격대대였다. 이들의 임무는 적의 보급로를 차단하고 후방을 교란하는 것이었다. 오늘 학생들이 걸은 해안은 그런 전쟁의 경험을 기억하는 공간이다. [장사상륙작전전승기념관](https://stay.yd.go.kr/jangsa/pages/sub.htm?nav_code=jan1588571264)\n\n오늘 이곳을 걷는 학생들의 모습과 학도병의 역사를 함께 놓으면, 전쟁이 학생의 일상을 어떻게 바꾸었는지 묻게 된다. 기념공원의 이름을 아는 것에서 당시 사람들의 처지를 살피는 일로 답사가 이어지는 대목이다.\n\n## 냉수리 신라비, 돌에 새긴 것은 사람 사이의 문제였다\n\n냉수리 신라비 앞에서는 학생이 자료를 보며 설명을 이어 갔다. 비각 안의 돌을 바라보는 일과 그 돌에 새겨진 내용을 이해하는 일 사이에는 해설이 필요하다. 글자가 남은 유물이라고 해서 오늘의 독자가 곧바로 읽을 수 있는 것은 아니기 때문이다.\n\n국립문화유산연구원의 금석문 자료는 냉수리비를 503년, 지증왕 때의 기록으로 설명한다. 비문에는 절거리라는 인물의 재산을 둘러싼 다툼과 그 소유권을 결정한 내용이 담겨 있다. 왕과 유력자들이 이전의 판단을 근거로 분쟁을 처리했다는 점에서 당시 정치 운영과 재산 관계를 살필 자료가 된다. [국가유산 지식이음 · 포항 냉수리 신라비](https://portal.nrich.go.kr/kor/ksmUsrView.do?ksm_idx=2754&menuIdx=584)\n\n신라의 역사를 한 개인의 재산 문제에서 읽어 보면, 누가 판단할 권한을 가졌고 그 결정을 왜 돌에 남겼는지가 궁금해진다. 비석은 당시 사람들이 무엇을 중요하게 여겼는지 보여 주는 기록이기도 하다.\n\n## 봉분과 고인돌, 글자 밖의 자료를 살피다\n\n냉수리 고분군에서는 학생들이 봉분과 안내판을 함께 살펴보았다. 국가유산포털은 ‘영일 냉수리 고분’을 삼국시대의 무덤 유적으로 분류한다. 비문을 읽던 시선이 이곳에서는 무덤의 형태와 구조로 옮겨 간다. 겉에서 보이는 봉분과 발굴조사를 통해 밝혀진 내부를 구별해 읽어야 하는 장소다. [국가유산포털 · 영일 냉수리 고분](https://www.heritage.go.kr/heri/cul/culSelectDetail.do?ccbaKdcd=23&ccbaAsno=00950000&ccbaCtcd=37&ccbaCpno=2333700950000)\n\n문성리 고인돌 곁에서도 학생들의 현장 설명이 이어졌다. 고인돌은 일반적으로 청동기시대의 무덤과 기념물로 축조된 거석 유적이다. 국립문화유산연구원의 고고학사전은 큰 덮개돌뿐 아니라 받침돌, 묘역 시설, 지하 무덤방 등의 구조를 함께 설명한다. 눈에 드러난 큰 돌 하나가 유적의 전부는 아니라는 뜻이다. [한국고고학사전 · 고인돌](https://dka.nrich.go.kr/wiki/index.php/600-0162)\n\n냉수리의 봉분과 문성리의 큰 돌은 모양부터 다르다. 두 장소를 함께 살피면 옛사람들이 죽은 이를 위해 공간과 재료를 사용한 방식도 비교해 볼 수 있다. 그 차이를 설명하려면 현장에서 본 형태에 발굴과 조사 자료를 더해야 한다. 겉으로 드러난 모습과 땅속에서 확인된 흔적을 함께 읽는 것이 고고학 자료를 이해하는 출발점이다.\n\n## 친구가 설명자가 되는 답사\n\n이번 현장에는 마이크를 착용한 학생이 자료를 살피며 설명하고, 친구들이 가까이에서 듣는 모습이 남았다. 비각 앞과 큰 나무 아래가 차례로 발표 자리가 되었다. 유적을 배경으로 서는 데서 한 걸음 더 나아가, 그 유적을 친구에게 설명하는 학생의 역할도 드러났다.\n\n장사리의 기념공원은 전쟁의 기억을 전하고, 냉수리비는 글로 남긴 결정을 보여 주며, 고분과 고인돌은 형태와 구조로 과거를 묻게 한다. 가까운 지역을 걸었지만 만난 역사는 한 시대에 머물지 않았다. 이번 기행을 다시 떠올릴 때, 장소의 이름과 함께 그곳에서 과거를 읽게 해 준 자료도 기억해 볼 만하다. 해변의 기념시설, 비석의 글자, 봉분과 큰 돌이 각각 다른 답을 건네고 있었다.", "byline": "", "year": 2026, "category": "학교 이야기", "photos": [{"id": "92722fe1-4be9-4a83-8456-2fcb40827aa7", "caption": "호국길 걷기 행사장에 모인 참가자들.", "alt": "호국길 걷기 행사장에 모인 참가자들.", "width": "4000", "height": "3000", "after": "1", "webPath": "public/contrib-64f6c32d-392a-466d-8a80-638c8500e875/45/92722fe1-4be9-4a83-8456-2fcb40827aa7.webp"}, {"id": "f56709f9-0226-4a7f-82d8-ea301c3e26d2", "caption": "장사리 해변을 따라 호국길 걷기에 참여한 학생들.", "alt": "장사리 해변을 따라 호국길 걷기에 참여한 학생들.", "width": "4000", "height": "3000", "after": "3", "webPath": "public/contrib-64f6c32d-392a-466d-8a80-638c8500e875/45/f56709f9-0226-4a7f-82d8-ea301c3e26d2.webp"}, {"id": "94bcbc17-78bd-424b-997b-d5691c4ca47a", "caption": "장사리 해변에서 바라본 선박 형태의 기념시설.", "alt": "장사리 해변에서 바라본 선박 형태의 기념시설.", "width": "4000", "height": "3000", "after": "3", "webPath": "public/contrib-64f6c32d-392a-466d-8a80-638c8500e875/45/94bcbc17-78bd-424b-997b-d5691c4ca47a.webp"}, {"id": "e95e0310-07f5-4e5a-9d27-a361bedf397b", "caption": "푸른 하늘에 흰 궤적을 남기는 블랙이글스 편대비행.", "alt": "푸른 하늘에 흰 궤적을 남기는 블랙이글스 편대비행.", "width": "3000", "height": "4000", "after": "3", "webPath": "public/contrib-64f6c32d-392a-466d-8a80-638c8500e875/45/e95e0310-07f5-4e5a-9d27-a361bedf397b.webp"}, {"id": "55975f6e-9a18-467b-9618-a4d83ff642ad", "caption": "장사리 해변에서 활동하는 학생들.", "alt": "장사리 해변에서 활동하는 학생들.", "width": "4000", "height": "3000", "after": "3", "webPath": "public/contrib-64f6c32d-392a-466d-8a80-638c8500e875/45/55975f6e-9a18-467b-9618-a4d83ff642ad.webp"}, {"id": "82997b84-08e9-43e2-9f5a-69 T07:15:34.573Z"}, {"id": "contrib-65452355-05b5-4c56-bea1-1d6294df40ad", "title": "책을 고르는 자리에서, 생각을 나누는 도서관으로", "deck": "3월 13일 도서관 오프닝 데이, 새 단장한 공간과 1년 만에 다시 꾸린 도서부", "body": "도서관 대출·반납 데스크 옆에 색색의 메모지가 붙었다. 게시판의 제목은 ‘내 마음을 흔든 한 문장’. 책을 반납하기 전 기억에 남은 문장을 적어 보라는 안내 곁에는 메모지와 필기구가 놓여 있었다. 책을 돌려주는 자리에서 읽은 흔적을 남기는 자리로, 도서관을 이용하는 방법이 하나 더 생긴 셈이다.\n\n2026년 3월 13일, 포항고등학교에서 도서관 오프닝 데이가 열렸다. 새롭게 꾸민 도서관을 학생들과 만나게 하는 한편, 지난 1년간 부재했던 도서부의 새 부원을 모집하며 활동을 다시 시작하는 행사였다. 공간의 새 단장과 함께, 그 안에서 책을 읽고 소개할 학생들의 참여가 이번 출발의 중심에 놓였다.\n\n## 표지가 보이는 책, 손이 닿는 진열대\n\n도서관 중앙의 진열대에는 책들이 표지를 드러낸 채 놓였다. 『지중해 세계사』와 『파친코』 등 서로 다른 책이 나란히 보였고, 앞쪽에는 펼쳐 놓거나 눕혀 놓은 책도 있었다. 학생들은 진열대 둘레에 서서 책을 살펴봤다. 서가에서 원하는 제목을 찾아가는 방식과는 또 다른 책과의 만남이었다.\n\n찾을 책을 미리 정하지 않고 들어온 학생에게는 이런 전시가 출발점이 될 수 있다. 표지와 제목을 비교하고, 한 권을 집어 내용을 살펴보면서 자신의 관심사를 찾아갈 수 있기 때문이다. 진열대에는 ‘책 나눔 행사’라는 안내도 놓였다. 책을 눈에 띄게 소개하는 일과 다른 독자에게 건네는 일을 같은 공간에서 만날 수 있었다.\n\n## 책을 반납한 뒤에도 남는 한 문장\n\n책을 살펴보는 진열대 가까이에서는 글을 적는 학생의 모습도 보였다. ‘내 마음을 흔든 한 문장’ 게시판에는 분홍색과 노란색, 연두색 메모지가 붙어 있었다. 옆 책상에 놓인 빈 메모지는 다음 독자가 자기 문장을 보탤 자리를 남겨 두고 있었다.\n\n한 문장을 고르는 일에는 읽은 내용을 다시 살피는 과정이 필요하다. 여러 문장 가운데 무엇이 기억에 남았는지, 왜 그 대목에서 멈췄는지 돌아보게 된다. 게시판을 읽는 친구에게는 그것이 다른 책으로 들어가는 입구가 될 수도 있다. 같은 책에서도 서로 다른 문장을 고를 수 있다는 점에서, 짧은 메모는 독서의 취향과 생각을 나누는 방법이 된다.\n\n## 다시 꾸린 도서부, 이용자에서 활동의 주체로\n\n이번 오프닝 데이의 또 다른 변화는 도서부의 재출발이다. 한 해의 공백을 지나 새로 모인 부원들은 앞으로의 활동을 잘해 보겠다는 다짐과 설렘을 안고 출발했다. 도서관을 찾는 학생 가운데 이 공간의 활동을 함께 만들어 갈 부원들이 다시 생겼다는 점에서, 이번 새 출발은 공간의 변화와 사람의 변화를 함께 담았다.\n\n도서부의 재구성은 학생들이 책을 이용하는 데서 한 걸음 더 나아가, 다른 학생과 책을 어떻게 연결할지 생각할 자리를 마련한다. 어떤 책을 먼저 소개할지, 친구가 궁금해할 내용은 무엇일지, 읽어 볼 마음이 들도록 어떻게 설명할지. 새 부원들의 다짐이 앞으로 구체적인 활동으로 이어질 때 마주할 질문들이다.\n\n부원들의 바람에는 포항고 학생들이 자신들이 전하는 기사를 관심 있게 읽어 주었으면 하는 마음도 담겼다. 책을 소개하고 학교의 이야기를 전할 때, 그 글을 읽을 사람은 매일 마주치는 친구들이다. 게시판에 남긴 짧은 문장에서 교지의 기사까지, 새 도서부가 친구들과 나눌 이야기가 이제 시작된다.", "byline": "", "year": 2026, "category": "학교 이야기", "photos": [{"id": "a2e9a172-0589-43ff-bd14-90b072ac77eb", "caption": "3월 13일 도서관 오프닝 데이, 대출·반납 데스크에 모인 학생들.", "alt": "3월 13일 도서관 오프닝 데이, 대출·반납 데스크에 모인 학생들.", "width": "4032", "height": "3024", "after": "-1", "webPath": "public/contrib-65452355-05b5-4c56-bea1-1d6294df40ad/36/a2e9a172-0589-43ff-bd14-90b072ac77eb.webp"}, {"id": "ab4c8820-9f30-4a6a-a930-6b12a16c342d", "caption": "대출·반납 데스크에서 책과 함께 순서를 기다리는 학생들.", "alt": "대출·반납 데스크에서 책과 함께 순서를 기다리는 학생들.", "width": "4032", "height": "3024", "after": "1", "webPath": "public/contrib-65452355-05b5-4c56-bea1-1d6294df40ad/36/ab4c8820-9f30-4a6a-a930-6b12a16c342d.webp"}, {"id": "e3e48655-715c-4e92-8754-310e3a4990f6", "caption": "도서관 중앙 진열대에서 책을 살펴보는 학생들.", "alt": "도서관 중앙 진열대에서 책을 살펴보는 학생들.", "width": "4032", "height": "3024", "after": "3", "webPath": "public/contrib-65452355-05b5-4c56-bea1-1d6294df40ad/36/e3e48655-715c-4e92-8754-310e3a4990f6.webp"}, {"id": "f39589a9-2d12-4051-aac1-5350cdfa4c81", "caption": "‘내 마음을 흔든 한 문장’ 게시판 옆에서 글을 적는 학생.", "alt": "‘내 마음을 흔든 한 문장’ 게시판 옆에서 글을 적는 학생.", "width": "4032", "height": "3024", "after": "6", "webPath": "public/contrib-65452355-05b5-4c56-bea1-1d6294df40ad/36/f39589a9-2d12-4051-aac1-5350cdfa4c81.webp"}, {"id": "642a4009-00fe-4ce1-8a87-f19adee4f39a", "caption": "‘책 나눔 행사’ 안내와 함께 마련된 도서 진열대.", "alt": "‘책 나눔 행사’ 안내와 함께 마련된 도서 진열대.", "width": "4032", "height": "3024", "after": "4", "webPath": "public/contrib-65452355-05b5-4c56-bea1-1d6294df40ad/36/642a4009-00fe-4ce1-8a87-f19adee4f39a.webp"}, {"id": "99b1d4e0-c6a6-4c86-9fe2-097d56477775", "caption": "오프닝 데이의 도서관 내부 풍경.", "alt": "오프닝 데이의 도서관 내부 풍경.", "width": "4032", "height": "3024", "after": "10", "webPath": "public/contrib-65452355-05b5-4c56-bea1-1d6294df40ad/36/99b1d4e0-c6a6-4c86-9fe2-097d56477775.webp"}, {"id": "b761eeea-4964-4d42-b2aa-b224627c3195", "caption": "학생들의 문장이 모인 ‘내 마음을 흔든 한 문장’ 게시판.", "alt": "학생들의 문장이 모인 ‘내 마음을 흔든 한 문장’ 게시판.", "width": "4032", "height": "3024", "after": "7", "webPath": "public/contrib-65452355-05b5-4c56-bea1-1d6294df40ad/36/b761eeea-4964-4d42-b2aa-b224627c3195.webp"}, {"id": "6f8aed43-fb2c-4e74-b3f8-964082b30c6f", "caption": "도서관 데스크 앞에서 손으로 브이를 그리며 기념사진을 남기는 학생들.", "alt": "도서관 데스크 앞에서 손으로 브이를 그리며 기념사진을 남기는 학생들.", "width": "4032", "height": "3024", "after": "11", "webPath": "public/contrib-65452355-05b5-4c56-bea1-1d6294df40ad/36/6f8aed43-fb2c-4e74-b3f8-964082b30c6f.webp"}], "sourceRevision": "36", "publishedAt": "2026-10-26T07:00:24.854Z"}, {"id": "contrib-acce3d58-b987-4b67-a547-a4ca8f103c46", "title": "무대에서 실험대로, 호기심이 움직인 하루", "deck": "5월 7일 창의과학캠프, 공연 관람부터 캔위성 활동과 전시 체험까지", "body": "2026년 5월 7일 포항고등학교 창의과학캠프에서 학생들은 오전 매직쇼를 관람하고, 오후에는 캔위성 활동에 참여했다. 객석에서 무대를 바라보던 학생들이 부품과 노트북이 놓인 실습대로 자리를 옮겼다. 이날 기록에는 전시 설비를 살펴보고 가상현실 기기를 체험하는 모습도 담겼다.\n\n## 객석에서 실습대로\n\n오전 공연 사진에는 진행자와 무대 화면을 바라보는 학생들이 보인다. 오후 실습실에서는 캔위성 설명 화면 앞에 학생들이 모였다. 책상에는 부품과 연결선, 노트북이 놓였고, 학생들은 손에 든 부품을 살피거나 화면을 확인했다.\n\n공연 관람과 장치 실습은 참여하는 방식이 다르다. 무대에서 완성된 장면을 보는 데서, 여러 부품을 가까이 놓고 그 구성을 살펴보는 활동으로 이어졌다. 이날 오후 활동의 주제인 캔위성을 이해하려면 먼저 이름 속 ‘위성’이 무엇을 뜻하는지 살펴볼 필요가 있다.\n\n## 캔 안에 담는 위성의 기능\n\n유럽우주국(ESA)은 캔위성을 음료 캔의 크기와 형태 안에 실제 위성의 기능을 모사한 장치로 설명한다. 전원과 통신 등 위성의 주요 기능을 제한된 공간에 함께 구성하는 것이 교육 과제다. 캔위성은 우주로 보내는 실제 인공위성을 그대로 축소한 물건이라기보다, 여러 기능을 연결해 하나의 장치로 만드는 과정을 배우는 소재다.\n\n전원은 각 부분을 작동시키고 통신은 정보를 전달하는 역할을 한다. 이런 기능이 따로 존재하는 것만으로는 하나의 장치가 되지 않는다. 필요한 부분을 연결하고 함께 작동하는지 확인해야 한다. 작은 캔이라는 제약 안에서 부품의 역할과 관계를 살펴보게 되는 이유다. 이는 캔위성의 일반적인 원리이며, 이날 사용한 교구의 세부 기능이나 실습 결과를 뜻하지는 않는다.\n\n## 손에 든 부품과 노트북 화면\n\n실습 사진에는 한 학생이 장치를 다루는 동안 곁의 학생이 노트북 화면을 보는 모습이 남아 있다. 부품을 가까이에서 살피는 장면과 화면을 확인하는 장면은, 캔위성 활동이 완성된 장치를 구경하는 데 그치지 않았음을 보여 준다. 다만 사진만으로 어떤 데이터를 확인했는지, 장치를 어디까지 완성했는지 알 수는 없다.\n\n전시 공간에서는 설비 주변에 모인 학생들과 가상현실 기기를 착용한 학생들도 보인다. 무대의 객석, 부품이 놓인 책상, 체험 좌석으로 이어지는 사진에는 하루 동안 서로 다른 방식으로 과학을 만난 학생들의 모습이 담겼다.\n\n체험을 더 깊은 탐구로 이어 가려면 자신이 다룬 부품 하나부터 설명해 보는 것도 방법이다. 그 부품은 무슨 일을 하며, 다른 부분과 어떻게 연결되는가. 캔위성의 원리를 알아가는 출발점은 작은 장치 안에서 각 부분이 맡은 일을 구체적으로 묻는 데 있다.\n\n참고자료: 유럽우주국(ESA), 「CanSat overview」 — https://education.esa.int/CanSat_overview/", "byline": "", "year": 2026, "category": "학교 이야기", "photos": [{"id": "87c0d5c2-87c2-4bb5-9262-723edad2e44a", "caption": "오전 매직쇼 공연을 관람하는 학생들.", "alt": "오전 매직쇼 공연을 관람하는 학생들.", "width": "4000", "height": "3000", "after": "-1", "webPath": "public/contrib-acce3d58-b987-4b67-a547-a4ca8f103c46/38/87c0d5c2-87c2-4bb5-9262-723edad2e44a.webp"}, {"id": "81fc5353-8c43-4579-8280-234dfee602a4", "caption": "캔위성 설명 화면 앞에서 활동에 참여하는 학생들.", "alt": "캔위성 설명 화면 앞에서 활동에 참여하는 학생들.", "width": "4000", "height": "3000", "after": "2", "webPath": "public/contrib-acce3d58-b987-4b67-a547-a4ca8f103c46/38/81fc5353-8c43-4579-8280-234dfee602a4.webp"}, {"id": "bbd167ad-8eb3-445d-bf6f-8eebffb7e741", "caption": "책상 위 실습 도구를 가까이에서 살펴보는 학생들.", "alt": "책상 위 실습 도구를 가까이에서 살펴보는 학생들.", "width": "3000", "height": "4000", "after": "8", "webPath": "public/contrib-acce3d58-b987-4b67-a547-a4ca8f103c46/38/bbd167ad-8eb3-445d-bf6f-8eebffb7e741.webp"}, {"id": "b002407e-c941-4a5f-afaf-1830ac77426c", "caption": "실습실에서 설명을 들으며 캔위성 활동을 준비하는 학생들.", "alt": "실습실에서 설명을 들으며 캔위성 활동을 준비하는 학생들.", "width": "4000", "height": "3000", "after": "8", "webPath": "public/contrib-acce3d58-b987-4b67-a547-a4ca8f103c46/38/b002407e-c941-4a5f-afaf-1830ac77426c.webp"}, {"id": "9b008dab-76e2-40be-a3c3-239e9a2d1bd2", "caption": "노트북과 캔위성 부품을 함께 살펴보는 학생들.", "alt": "노트북과 캔위성 부품을 함께 살펴보는 학생들.", "width": "6000", "height": "3376", "after": "8", "webPath": "public/contrib-acce3d58-b987-4b67-a547-a4ca8f103c46/38/9b008dab-76e2-40be-a3c3-239e9a2d1bd2.webp"}, {"id": "fbb9483c-7231-4c7c-9fab-4065af0a5626", "caption": "지구본과 노트북이 놓인 책상에서 실습 장치를 살펴보는 학생들.", "alt": "지구본과 노트북이 놓인 책상에서 실습 장치를 살펴보는 학생들.", "width": "3000", "height": "4000", "after": "8", "webPath": "public/contrib-acce3d58-b987-4b67-a547-a4ca8f103c46/38/fbb9483c-7231-4c7c-9fab-4065af0a5626.webp"}, {"id": "eb707eac-9757-4ce8-9db8-49ccfe503342", "caption": "노트북 곁에서 연결선과 작은 부품을 다루는 학생.", "alt": "노트북 곁에서 연결선과 작은 부품을 다루는 학생.", "width": "3000", "height": "4000", "after": "8", "webPath": "public/contrib-acce3d58-b987-4b67-a547-a4ca8f103c46/38/eb707eac-9757-4ce8-9db8-49ccfe503342.webp"}, {"id": "65ecd408-e923-41f6-9db3-ef56e96c09d7", "caption": "각자의 책상에서 노트북과 실습 도구를 사용하는 학생들.", "alt": "각자의 책상에서 노트북과 실습 도구를 사용하는 학생들.", "width": "4032", "height": "3024", "after": "8", "webPath": "public/contrib-acce3d58-b987-4b67-a547-a4ca8f103c46/38/65ecd408-e923-41f6-9db3-ef56e96c09d7.webp"}, {"id": "c7a77709-727c-4e0b-96c0-17783b85d620", "caption": "전시 공간의 체험 설비 주변에 모인 학생들.", "alt": "전시 공간의 체험 설비 주변에 모인 학생들.", "width": "6000", "height": "3376", "after": "9", "webPath": "public/contrib-acce3d58-b987-4b67-a547-a4ca8f103c46/38/c7a77709-727c-4e0b-96c0-17783b85d620.webp"}, {"id": "d7d209b8-5513-41c9-ba2d-5128ecbc0928", "caption": "가상현실 기기를 착용하고 체험 좌석에 앉은 학생들.", "alt": "가상현실 기기를 착용하고 체험 좌석에 앉은 학생들.", "width": "6000", "height": "3376", "after": "9", "webPath": "public/contrib-acce3d58-b987-4b67-a547-a4ca8f103c46/38/d7d209b8-5513-41c9-ba2d-5128ecbc0928.webp"}], "sourceRevision": "38", "publishedAt": "2026-10-26T07:14:25.826Z"}, {"id": "contrib-b9310dd1-4a75-473b-b910-370e6a7865bd", "title": "같은 화면을 바라보며, 포고가 함께 응원한 날", "deck": "6월의 월드컵 응원현장, 체육관에 모인 학생들의 한마음", "body": "체육관 무대 앞에 의자가 줄지어 놓였다. 학생들이 바라보는 곳은 코트의 공이 아니라 무대 위 대형 화면이었다. 다른 응원 장면에서는 코트에 앉은 학생들이 두 팔을 머리 위로 들어 박수를 보냈다. 2026년 6월 19일과 25일의 월드컵 응원현장은 학교의 익숙한 운동 공간이 경기를 함께 보는 자리로 바뀐 모습에서 시작된다.\n\n## 화면 앞에 마련된 또 하나의 관람석\n\n의자에 앉아 관람하는 장면에서는 객석 뒤쪽까지 학생들의 자리가 이어졌다. 코트 바닥에 모여 앉은 장면에서는 친구들의 어깨가 더 가깝게 맞닿았다. 앉는 방식은 달라도 무대 위 화면을 중심으로 사람들이 모였다는 점은 같았다. 농구 골대와 바닥의 경기선은 그대로인 체육관 안에, 축구를 관람하는 자리가 생긴 것이다.\n\n## 함께 응원하는 손\n\n두 손을 들어 올린 학생들 사이에는 손뼉을 맞대는 모습도 보였다. 화면은 선수들이 뛰는 경기장을 보여 주고, 관람석은 그 경기를 지켜보는 학생들의 반응을 드러냈다. 응원 장면을 한 장 남기면 경기 중계만으로는 보이지 않던 학교 쪽의 풍경도 함께 남는다.\n\n혼자 경기를 볼 때는 화면 바깥의 반응을 알기 어렵다. 공동 관람에서는 가까이에 앉은 사람의 손짓과 몸의 움직임도 경기 경험의 일부가 된다. 포항고의 응원 장면에서도 화면을 향한 시선과 들어 올린 팔이 한꺼번에 보였다. 학교의 일상을 기록하는 교지는 이렇게 중계 카메라가 담지 않는 관람석 쪽을 함께 남길 수 있다.\n\n## 경기 화면 밖에도 남은 학교의 장면\n\n응원 사진과 함께 전달된 무대 앞 단체사진에는 농구공과 라켓을 든 학생들이 함께 등장한다. 뒤편에는 경기 화면이 이어지고, 학생들은 주먹을 쥐거나 브이를 그리며 카메라를 바라본다. 평소 체육관에서 사용하는 운동 도구와 공동 응원의 모습이 한 장에 겹쳐진다. 경기장에 가지 않아도 학교 안에서 함께 관람한 시간을 남길 수 있었던 장면이다.\n\n경기의 공식 기록이 승패와 점수를 남긴다면, 학교의 기록에는 누구와 어디에서 함께 보았는지도 담긴다. 줄지어 놓인 의자, 바닥에 모여 앉은 학생들, 운동 도구를 든 단체사진은 같은 체육관의 서로 다른 표정이다. 이번 응원을 기억하게 하는 것은 화면 속 경기와 더불어 그 앞에 모였던 우리 학교의 학생들이다.", "byline": "", "year": 2026, "category": "학교 이야기", "photos": [{"id": "54993633-f6bd-4504-bff8-dc3be699b57f", "caption": "체육관 대형 화면으로 축구 경기를 함께 관람하는 학생들.", "alt": "체육관 대형 화면으로 축구 경기를 함께 관람하는 학생들.", "width": "4000", "height": "2252", "after": "0", "webPath": "public/contrib-b9310dd1-4a75-473b-b910-370e6a7865bd/18/54993633-f6bd-4504-bff8-dc3be699b57f.webp"}, {"id": "b56fb243-519b-4288-999d-fe31b7619d4e", "caption": "코트에 모여 앉아 두 손을 들고 응원하는 학생들.", "alt": "코트에 모여 앉아 두 손을 들고 응원하는 학생들.", "width": "1280", "height": "960", "after": "4", "webPath": "public/contrib-b9310dd1-4a75-473b-b910-370e6a7865bd/18/b56fb243-519b-4288-999d-fe31b7619d4e.webp"}, {"id": "99051cb2-e728-40f7-a1b0-42938f995ec1", "caption": "경기 화면을 뒤로하고 함께 기념사진을 남긴 학생들.", "alt": "경기 화면을 뒤로하고 함께 기념사진을 남긴 학생들.", "width": "933", "height": "699", "after": "7", "webPath": "public/contrib-b9310dd1-4a75-473b-b910-370e6a7865bd/18/99051cb2-e728-40f7-a1b0-42938f995ec1.webp"}], "sourceRevision": "18", "publishedAt": "2026-10-26T07:01:55.478Z"}, {"id": "contrib-c0da0b77-b1bc-423b-9c12-5ff6df91c4c3", "title": "교실 밖에서 남긴, 우리들의 첫 봄", "deck": "[사진에세이] 3월 30일부터 4월 1일까지, 1학년 야영의 한 장면", "body": "2026년 3월 30일부터 4월 1일까지 포항고등학교 1학년 야영이 진행됐다. 입학 후 첫 달이 끝나던 때, 학생들은 교실을 벗어나 숲을 배경으로 단체사진을 남겼다. 사진 뒤편 현수막에는 ‘여기까지 온 너, 진짜 멋있다.’라는 문장이 적혀 있다.\n\n## 숲 앞에 남긴 첫 학년의 얼굴들\n\n나무가 둘러선 길에서 학생들이 앞뒤로 자리를 잡았다. 앞줄에는 앉은 학생들이, 그 뒤에는 선 학생들이 화면을 채웠다. 얼굴 가까이 손을 올리거나 팔을 펼친 학생도 있고, 카메라를 바라보며 서 있는 학생도 있다. 같은 장소에서 찍은 사진이지만 사람마다 자세가 다르다.\n\n이 기록에서 먼저 눈에 들어오는 것은 거창한 활동의 성과보다 얼굴들이다. 고등학교 생활을 시작한 3월의 끝에, 같은 학년의 학생들이 교실 밖 한자리에 모였다. 사진에 담긴 것은 그날의 한순간이지만, 시간이 흐른 뒤에도 누구와 첫 봄을 보냈는지 돌아볼 수 있는 기록이다.\n\n## ‘여기까지 온 너, 진짜 멋있다.’\n\n현수막의 문장은 사진 속 학생들에게 건네는 짧은 응원처럼 읽힌다. 고등학교 생활을 막 시작한 이들에게, 앞으로의 목표에 앞서 지금까지 걸어온 시간을 바라보게 하는 말이다.\n\n사진 한 장으로 사흘의 야영을 모두 설명할 수는 없다. 다만 첫 학년의 봄, 숲 앞에 나란히 선 얼굴들과 그 뒤에 걸린 응원의 문장은 남아 있다. 이번 사진 기록은 그 장면을 다시 펼쳐 보는 자리다.", "byline": "", "year": 2026, "category": "학교 이야기", "photos": [{"id": "d8b958f0-aa68-4d7f-b424-7810d6de831e", "caption": "응원 문구가 적힌 현수막 앞에서 기념사진을 남긴 1학년 학생들.", "alt": "응원 문구가 적힌 현수막 앞에서 기념사진을 남긴 1학년 학생들.", "width": "4032", "height": "2268", "after": "-1", "webPath": "public/contrib-c0da0b77-b1bc-423b-9c12-5ff6df91c4c3/21/d8b958f0-aa68-4d7f-b424-7810d6de831e.webp"}, {"id": "903a6f55-4e30-4ad9-8fb0-fa7debc4055a", "caption": "숲을 배경으로 함께 기념사진을 남긴 1학년 학생들.", "alt": "숲을 배경으로 함께 기념사진을 남긴 1학년 학생들.", "width": "4032", "height": "2268", "after": "2", "webPath": "public/contrib-c0da0b77-b1bc-423b-9c12-5ff6df91c4c3/21/903a6f55-4e30-4ad9-8fb0-fa7debc4055a.webp"}, {"id": "bd9d9916-38ad-4e36-b162-abc5e78295d1", "caption": "각기 다른 손짓과 자세로 단체사진을 채운 학생들.", "alt": "각기 다른 손짓과 자세로 단체사진을 채운 학생들.", "width": "4032", "height": "2268", "after": "2", "webPath": "public/contrib-c0da0b77-b1bc-423b-9c12-5ff6df91c4c3/21/bd9d9916-38ad-4e36-b162-abc5e78295d1.webp"}, {"id": "04a5cfdc-7a29-45fe-898a-f5158aae765f", "caption": "숲을 배경으로 함께 기념사진을 남긴 1학년 학생들.", "alt": "숲을 배경으로 함께 기념사진을 남긴 1학년 학생들.", "width": "4032", "height": "2268", "after": "3", "webPath": "public/contrib-c0da0b77-b1bc-423b-9c12-5ff6df91c4c3/21/04a5cfdc-7a29-45fe-898a-f5158aae765f.webp"}, {"id": "d36a5dc2-2d8e-4c0d-b696-d2e3e614a5c5", "caption": "숲을 배경으로 함께 기념사진을 남긴 1학년 학생들.", "alt": "숲을 배경으로 함께 기념사진을 남긴 1학년 학생들.", "width": "3474", "height": "2481", "after": "6", "webPath": "public/contrib-c0da0b77-b1bc-423b-9c12-5ff6df91c4c3/21/d36a5dc2-2d8e-4c0d-b696-d2e3e614a5c5.webp"}], "sourceRevision": "21", "publishedAt": "2026-10-26T07:03:17.578Z"}, {"id": "contrib-df14a8ac-7cc9-4576-9a0a-7e56761450f0", "title": "새 책 앞에서 멈춘 발걸음, 도서관에 머문 시간", "deck": "6월 2일 새책맞이행사, 책을 고르는 자리에서 함께 읽는 공간으로", "body": "도서관 중앙의 전시대 앞에서 한 학생이 책 쪽으로 손을 뻗는다. 옆의 학생들은 나란히 놓인 표지를 살핀다. 서가에서는 제목이 적힌 책등이 먼저 보이지만, 이 자리에서는 표지의 색과 그림까지 한눈에 들어온다. 새 책이 학생을 만나는 첫 장면이다.\n\n2026년 6월 2일 포항고등학교에서 열린 새책맞이행사에는 책을 고르고 펼쳐 보는 학생들의 모습이 남았다. 그 풍경과 함께 살펴볼 자료가 있다. 학교의 1학기 도서 구입 신청 안내다. 전시대에서 보이는 독자의 선택과, 책을 들이기 전에 마련한 신청 기준을 함께 보면 도서관의 책이 독자를 만나기까지의 과정을 더 구체적으로 읽을 수 있다.\n\n## 새 책의 출발점은 소장 여부를 확인하는 일\n\n「2026학년도 1학기 포항고 도서관 새책 구입 신청(교직원)」 안내는 신청 전에 학교도서관의 소장 여부를 검색하도록 했다. 이미 있는 책이라도 최신 개정판은 신청할 수 있도록 하고, 정확한 도서명·저자·출판사·정가를 적도록 안내했다. 제목만으로 책을 고르는 데서 그치지 않고, 기존 자료와 겹치는지, 어떤 판본을 들이려는지를 확인하는 절차다.\n\n책의 용도는 대출용·수업용·만화방으로 나누었다. 수업용이 아니면 우선 한 권을 신청하고, 인기가 예상되는 책의 추가 부수는 도서부 동아리가 판단하도록 했다. 같은 책을 몇 권 둘 것인지에 학생들의 이용을 생각하는 판단이 들어가는 셈이다. 이 내용은 1학기 신청 단계의 안내이며, 6월 2일 전시된 책들의 구입 확정 목록이나 실제 납품 내역을 뜻하지는 않는다.\n\n## 책등에서 표지로, 발견하는 방식이 달라지다\n\n전시대에는 여러 권의 책이 표지를 앞으로 향한 채 놓였다. 학생들이 전시대 둘레에 서서 책을 살펴보는 동안, 뒤편 서가에서도 책을 찾는 모습이 이어졌다. 전시대와 서가는 같은 책을 서로 다른 방식으로 만나게 한다. 서가는 원하는 책을 찾아가는 자리이고, 전시대는 아직 읽을 생각이 없었던 책 앞에서도 잠시 멈춰 서게 하는 자리다.\n\n## 고르는 자리에서 읽는 자리로\n\n책과 만나는 과정은 전시대 앞에서 끝나지 않았다. 서가 옆 나무 단에는 신발을 벗고 앉아 책을 펼친 학생들이 있었다. 파랑·초록·주황색 쿠션에 기대거나 무릎 위에 책을 올려놓은 모습도 보였다. 다른 쪽에서는 작은 원탁을 사이에 두고 학생들이 마주 앉았다. 책을 고르는 자리와 펼쳐 보는 자리가 가까이 놓인 도서관의 풍경이다.\n\n## 신청의 기준과 독자의 선택 사이\n\n작은 탁자 주위로 여러 학생이 모인 장면과 책을 든 학생들의 기념사진도 남았다. 신청 안내에서 대출용과 수업용을 구분하고 추가 부수를 살폈다면, 도서관 현장에서는 학생들이 어떤 책에 손을 뻗고 어디에서 펼쳐 보는지가 눈에 들어온다. 책의 마련과 이용은 서로 다른 단계이지만 독자를 중심에 둔다는 점에서 이어진다.\n\n도서부가 추가 부수를 판단하도록 한 안내는 학생들이 책을 이용하는 사람인 동시에 도서관의 책 구성을 함께 생각하는 주체가 될 수 있음을 보여 준다. 전시대 앞에서 시작한 관심이 실제 독서로 이어지는지, 어떤 책을 더 찾게 되는지는 앞으로 살펴볼 일이다. 새책맞이의 풍경은 그 질문을 책장 밖, 학생들의 손 가까이로 가져왔다.", "byline": "", "year": 2026, "category": "학교 이야기", "photos": [{"id": "37e349b4-06e5-4585-adca-e7e77ac69668", "caption": "도서관에서 함께 기념사진을 남긴 학생들.", "alt": "도서관에서 함께 기념사진을 남긴 학생들.", "width": "4032", "height": "3024", "after": "1", "webPath": "public/contrib-df14a8ac-7cc9-4576-9a0a-7e56761450f0/45/37e349b4-06e5-4585-adca-e7e77ac69668.webp"}, {"id": "ac395c7b-3fa2-42a1-a986-6d481aebe2dd", "caption": "신간 전시대에 모여 책을 살펴보는 학생들.", "alt": "신간 전시대에 모여 책을 살펴보는 학생들.", "width": "4032", "height": "3024", "after": "6", "webPath": "public/contrib-df14a8ac-7cc9-4576-9a0a-7e56761450f0/45/ac395c7b-3fa2-42a1-a986-6d481aebe2dd.webp"}, {"id": "8e919025-53b0-49e1-845b-eb55529a9ea7", "caption": "서가에서 책을 살펴보는 학생들.", "alt": "서가에서 ght": "3024", "after": "10", "webPath": "public/contrib-df14a8ac-7cc9-4576-9a0a-7e56761450f0/45/c0157a6a-ff70-4fc1-831a-528da5434de7.webp"}, {"id": "89eea880-58a2-445f-8f93-d9c7cb4da401", "caption": "도서관의 작은 탁자 주변에 모인 학생들.", "alt": "도서관의 작은 탁자 주변에 모인 학생들.", "width": "4032", "height": "3024", "after": "10", "webPath": "public/contrib-df14a8ac-7cc9-4576-9a0a-7e56761450f0/45/89eea880-58a2-445f-8f93-d9c7cb4da401.webp"}, {"id": "caac7a04-26ec-4c63-9b25-d307c15cd30d", "caption": "도서관에서 함께 기념사진을 남긴 학생들.", "alt": "도서관에서 함께 기념사진을 남긴 학생들.", "width": "4032", "height": "3024", "after": "11", "webPath": "public/contrib-df14a8ac-7cc9-4576-9a0a-7e56761450f0/45/caac7a04-26ec-4c63-9b25-d307c15cd30d.webp"}], "sourceRevision": "45", "publishedAt": "2026-10-26T07:19:40.938Z"}, {"id": "contrib-ea8eb469-d471-4471-911f-9dfb7a313ab6", "title": "그날 점심시간, 포고는 노래 중", "deck": "5월 15일 첫 야외 버스킹, 학생과 선생님이 함께 채운 초록빛 무대", "body": "건반과 드럼, 기타와 베이스가 교정의 잔디 위에 놓였다. 마이크 앞에 선 공연자 뒤로 학교 건물이 보였고, 그 맞은편에는 학생들이 모여 있었다. 앞쪽에 앉은 학생과 뒤에 선 학생의 시선이 같은 곳으로 향했다. 평소 오가던 교정 안에 공연을 하는 자리와 듣는 자리가 생겼다.\n\n2026년 5월 15일 점심시간, 포항고등학교에서 첫 야외 ‘포고 버스킹’이 열렸다. 학생들의 노래와 연주에 선생님들의 노래가 더해졌다. 학교 안의 익숙한 얼굴들이 공연자와 관객으로 만난 이날, 공연의 배경은 별도의 공연장이 아니라 학생들이 매일 생활하는 교정이었다.\n\n## 같은 높이에서 마주한 공연자와 관객\n\n잔디 위에는 마이크와 악보대, 악기와 스피커가 자리했다. 공연자 가까이에는 의자에 앉아 기타를 연주하는 사람도, 건반 앞에서 두 손을 움직이는 사람도 있었다. 관객은 그 주변에 서거나 앉았다. 높은 단 위의 무대를 올려다보는 구도와 달리, 이날의 공연 사진에는 연주자와 관객이 가까운 거리에서 마주한 모습이 남았다.\n\n이런 배치에서는 노래를 부르는 사람뿐 아니라 공연을 함께 이루는 움직임도 눈에 들어온다. 기타의 줄을 짚는 손, 드럼스틱을 든 팔, 건반 앞에 놓인 악보가 하나의 공연 안에 있다. 노래의 앞자리를 맡은 목소리와 그 곁의 연주를 함께 바라볼 수 있다는 점은 가까운 야외 무대가 보여 주는 장면이다.\n\n## 마이크 곁에서 각자의 몫을 채운 악기들\n\n사진에는 마이크를 든 두 참가자가 종이를 살펴보는 모습과, 악보대 앞에서 노래하는 공연자의 모습이 담겼다. 노래 곁에는 드럼과 베이스가 있었고, 다른 장면에서는 일렉트릭 기타와 건반 연주가 보였다. 포고 버스킹의 무대를 이루는 것은 마이크 하나만이 아니었다.\n\n## 학생과 선생님이 함께 부른 점심시간\n\n선생님들도 노래로 공연에 참여했다. 학생들 못지않은 노래 실력이었다는 행사 소개처럼, 선생님들의 무대 역시 이날 버스킹에서 빼놓을 수 없는 부분이었다. 교실에서 수업으로 만나던 학생과 교사가 같은 공연의 참여자가 됐다는 점은 학교 버스킹만의 가까움을 보여 준다.\n\n학교에서는 서로를 정해진 자리에서 만날 때가 많다. 함께 수업을 듣는 친구, 교과를 가르치는 선생님이라는 익숙한 관계가 있다. 공연은 그 관계에 다른 모습을 더할 수 있다. 친구가 악기를 다루는 모습을 보고 선생님이 부르는 노래를 듣는 일은, 매일 만나는 사람에게도 아직 알지 못하는 관심과 표현 방식이 있음을 생각하게 한다.\n\n5월 15일의 기록에는 공연자만큼이나 그 주위에 모인 학생들의 모습이 남았다. 앞에서 노래하는 사람, 곁에서 악기를 연주하는 사람, 자리를 잡고 바라보는 사람이 같은 교정을 나누어 썼다. 첫 야외 버스킹이 남긴 구체적인 변화는 바로 그 장면이다. 점심시간의 교정에 서로의 공연을 보고 들을 자리가 마련됐고, 학생과 선생님이 그 자리를 함께 채웠다.", "byline": "", "year": 2026, "category": "학교 이야기", "photos": [{"id": "0c1dc66e-8656-4d48-bebb-908a8c857231", "caption": "점심시간, 교정에 모인 학생들이 첫 야외 ‘포고 버스킹’을 함께 즐기고 있다.", "alt": "점심시간, 교정에 모인 학생들이 첫 야외 ‘포고 버스킹’을 함께 즐기고 있다.", "width": "6240", "height": "4160", "after": "-1", "webPath": "public/contrib-ea8eb469-d471-4471-911f-9dfb7a313ab6/44/0c1dc66e-8656-4d48-bebb-908a8c857231.webp"}, {"id": "836d7389-cd05-416d-9fd6-4336518293b1", "caption": "교정을 무대 삼아 노래와 연주가 어우러진 5월의 버스킹.", "alt": "교정을 무대 삼아 노래와 연주가 어우러진 5월의 버스킹.", "width": "6240", "height": "4160", "after": "3", "webPath": "public/contrib-ea8eb469-d471-4471-911f-9dfb7a313ab6/44/836d7389-cd05-416d-9fd6-4336518293b1.webp"}, {"id": "7bb5c80c-52f8-4900-b383-cc9a83d36342", "caption": "가까운 거리에서 호흡을 맞추는 공연자들.", "alt": "가까운 거리에서 호흡을 맞추는 공연자들.", "width": "6240", "height": "4160", "after": "4", "webPath": "public/contrib-ea8eb469-d471-4471-911f-9dfb7a313ab6/44/7bb5c80c-52f8-4900-b383-cc9a83d36342.webp"}, {"id": "959ae849-fe26-41f0-905a-cd622433b9ee", "caption": "건반과 베이스가 함께한 야외 공연의 한 장면.", "alt": "건반과 베이스가 함께한 야외 공연의 한 장면.", "width": "6240", "height": "4160", "after": "6", "webPath": "public/contrib-ea8eb469-d471-4471-911f-9dfb7a313ab6/44/959ae849-fe26-41f0-905a-cd622433b9ee.webp"}, {"id": "d0b3ea05-cff2-4b7c-9e3f-d49d3f50c4dc", "caption": "마이크와 종이를 손에 든 두 참가자의 모습.", "alt": "마이크와 종이를 손에 든 두 참가자의 모습.", "width": "6240", "height": "4160", "after": "6", "webPath": "public/contrib-ea8eb469-d471-4471-911f-9dfb7a313ab6/44/d0b3ea05-cff2-4b7c-9e3f-d49d3f50c4dc.webp"}, {"id": "6af8b677-1b85-444c-a6bf-2da256952a43", "caption": "의자에 앉아 일렉트릭 기타를 연주하는 모습.", "alt": "의자에 앉아 일렉트릭 기타를 연주하는 모습.", "width": "6240", "height": "4160", "after": "6", "webPath": "public/contrib-ea8eb469-d471-4471-911f-9dfb7a313ab6/44/6af8b677-1b85-444c-a6bf-2da256952a43.webp"}, {"id": "b7a3ae93-4662-4721-9fd7-83b968287d70", "caption": "드럼과 베이스를 곁에 두고 노래하는 공연자.", "alt": "드럼과 베이스를 곁에 두고 노래하는 공연자.", "width": "6240", "height": "4160", "after": "8", "webPath": "public/contrib-ea8eb469-d471-4471-911f-9dfb7a313ab6/44/b7a3ae93-4662-4721-9fd7-83b968287d70.webp"}, {"id": "3888b874-95ce-4161-b532-2329a5b91f5f", "caption": "드럼스틱을 들어 올린 연주자. 노래 곁에서 리듬을 만들어 간다.", "alt": "드럼스틱을 들어 올린 연주자. 노래 곁에서 리듬을 만들어 간다.", "width": "6240", "height": "4160", "after": "6", "webPath": "public/contrib-ea8eb469-d471-4471-911f-9dfb7a313ab6/44/3888b874-95ce-4161-b532-2329a5b91f5f.webp"}, {"id": "94328672-cf9f-4b89-8cb8-7c72136fb5fa", "caption": "건반 위에 두 손을 올린 연주자의 모습.", "alt": "건반 위에 두 손을 올린 연주자의 모습.", "width": "6240", "height": "4160", "after": "6", "webPath": "public/contrib-ea8eb469-d471-4471-911f-9dfb7a313ab6/44/94328672-cf9f-4b89-8cb8-7c72136fb5fa.webp"}, {"id": "179dfefe-18e8-49f7-941b-f7b47a8fadad", "caption": "교정에 모여 공연을 함께하는 학생들.", "alt": "교정에 모여 공연을 함께하는 학생들.", "width": "6240", "height": "4160", "after": "9", "webPath": "public/contrib-ea8eb469-d471-4471-911f-9dfb7a313ab6/44/179dfefe-18e8-49f7-941b-f7b47a8fadad.webp"}, {"id": "d316c586-8eec-449e-9850-b37e863b7259", "caption": "공연자와 관객이 가까이 마주한 야외 버스킹 현장.", "alt": "공연자와 관객이 가까이 마주한 야외 버스킹 현장.", "width": "6240", "height": "4160", "after": "9", "webPath": "public/contrib-ea8eb469-d471-4471-911f-9dfb7a313ab6/44/d316c586-8eec-449e-9850-b37e863b7259.webp"}, {"id": "2c55dc1a-526b-45e4-a387-122af8b8f49e", "caption": "햇볕 아래 함께 모인 학생들. 평범한 점심시간에 공연이라는 즐거움이 더해졌다.", "alt": "햇볕 아래 함께 모인 학생들. 평범한 점심시간에 공연이라는 즐거움이 더해졌다.", "width": "6240", "height": "4160", "after": "10", "webPath": "public/contrib-ea8eb469-d471-4471-911f-9dfb7a313ab6/44/2c55dc1a-526b-45e4-a387-122af8b8f49e.webp"}], "sourceRevision": "44", "publishedAt": "2026-10-26T07:05:05.092Z"}, {"id": "woonbi-editor-greeting-shinjw-20261023", "title": "2026 웅비 편집장 인사말", "deck": "함께한 시간과 학교의 이야기를 기록하며", "body": "안녕하십니까. 2026년 웅비 신문의 편집장을 맡은 2학년 신진욱입니다.\n\n2026년 1학기가 시작한 지가 어제 같은데 어느덧 한 학년을 끝내가는 시기가 다가왔습니다. 이 신문을 읽고 계신 여러분은 이번 연도를 어떻게 보내셨나요?\n\n이번 신문을 작성하면서 학교에서 일어난 다양한 일들을 정리하고, 우리가 함께했던 여러 추억을 다시 돌아보는 시간을 가졌습니다. 그 과정에서 평소에는 무심코 지나쳤던 학교의 모습과 친구들의 이야기를 다시 돌아볼 수 있었습니다. 즐거웠던 시간도, 기뻤던 시간도, 심지어 슬펐던 시간과 화가 났던 시간조차도 결국 그 모든 순간들이 모여 2026년 한 해를 만들어 온 것 같습니다.\n\n2026년 웅비 신문에는 학교에서 있었던 여러 행사와 학생들의 이야기, 그리고 우리가 함께 보낸 시간들이 담겨 있습니다. 단순히 지나간 일을 기록하는 것이 아니라, 지금의 우리가 어떤 한 해를 보냈는지를 남기는 것이 이 신문의 의미가 아닐까 생각합니다.\n\n이번 웅비 신문을 준비하는 과정도 순탄하지만은 않았습니다. 2025년 다시 시작한 후 부족한 점이나 잘되지 않은 부분들을 동아리 부원들과 분석하고 함께 하나씩 고쳐 나가며, 더 나은 신문을 만들기 위해 최선을 다했습니다. 그 과정에서 좋은 기사를 쓰려고 노력하고 좋은 결과물을 만드느라 고생했던 동아리 부원들에게 감사를 전합니다.\n\n또한 기사의 소재가 되어 준 다양한 학교 행사를 만들어 주신 선생님들, 그리고 그 행사에 열심히 참여하며 기사를 쓸 수 있는 원동력이 되어 준 학생 여러분께도 감사드립니다.\n\n돌이켜보면 이 신문은 어느 한 사람의 노력만으로 만들어진 것이 아니라, 학교에서 함께 생활한 우리 모두의 시간과 이야기가 모여 만들어진 것이라고 생각합니다. 결국 이 신문은 학교에 있는 모든 분들이 최선을 다하여 완성될 수 있었습니다.\n\n그러니 이 신문을 읽으시면서 올해 학교에서 있었던 일들을 다시 한 번 떠올리고, 친구들과 함께했던 순간들을 추억할 수 있기를 바랍니다. 훗날 이 신문을 다시 펼쳐 보았을 때, 2026년의 우리가 어떤 모습이었는지 웃으며 떠올릴 수 있는 소중한 기록으로 남았으면 좋겠습니다.\n\n지금까지 2026년 웅비 신문 편집장 신진욱이었습니다. 다음 장부터 시작되는 2026년의 이야기를 천천히 읽어보시면서, 우리가 함께했던 즐거운 순간들을 다시 한 번 떠올리고 좋은 추억을 되새길 수 있기를 바랍니다.\n\n감사합니다.\n\n2026 편집장 신진욱", "byline": "신진욱 편집장", "year": 2026, "status": "approved", "category": "특집", "photos": [], "publishedAt": "2026-10-23T10:50:00+09:00"}, {"id": "woonbi-cherry-marathon-2026", "title": "벚꽃 아래 함께 달린 봄, 2026 웅비 단축 벚꽃 마라톤", "deck": "4월 3일 포항고 교정에서 함께 달린 봄날의 기록", "body": "포항고등학교가 지난 4월 체력왕 프로그램’의 일환으로 ‘웅비 단축벚꽃 마라톤 대회’를 성공적으로 개최했다.\n\n이번 행사는 신학기를 맞아 학생들이 기초 체력을 증진하고 올바른 건강 생활 습관을 형성할 수 있도록 돕기 위해 마련됐다. 특히 학업 부담에 노출되기 쉬운 청소년기 학생들에게 야외 신체 활동의 기회를 제공함으로써, 마라톤이라는 도전 과제를 함께 수행하고 정서적 성취감과 공동체 의식을 함양하는 데 기획 목적을 두었다.\n\n이날 대회는 만개한 벚꽃길을 따라 포항고등학교 운동장과 학교 주변에 조성된 2km 단축 코스에서 진행됐다. 행사에는 학생과 교직원이 다 함께 참가해 봄기운 가득한 교정 산책로를 활기찬 에너지로 채웠다.\n\n마라톤 코스는 포항고 교정을 출발해 흐드러지게 핀 벚꽃 산책로를 거쳐 돌아오는 구간으로 꾸려져 있어 참가자들에게 탁 트인 계절감을 선사했다. 출발 신호와 함께 첫발을 내딛은 학생들은 포근한 봄 바람을 맞으며 교실 밖 야외 활동의 자유로움을 만끽했다\n\n참가자들은 승부나 순위 경쟁에 연연하기보다 각자의 페이스를 유지하며 서로를 응원하고 격려하는 모습으로 결승선을 향해 달렸다. 화사하게 피어난 벚꽃길을 배경으로 발걸음을 맞추며 달리는 과정을 통해 신체 체력 향상은 물론, 학업 스트레스를 해소하고 친목을 다지는 뜻깊은 시간을 가졌다.\n\n이번 대회는 학생 스스로 건강 관리의 중요성을 깨닫고 배려와 협동 중심의 건전한 학교 문화를 조성하는 데 기여했다는 평가를 받고 있다\n\n## 벚꽃길에서 시작된 도전\n\n교정에는 벚꽃이 가득 피어 있었고, 학생들은 운동장에 모여 준비운동으로 몸을 풀었다. 무대 앞 현수막과 출발을 앞둔 학생들의 모습이 이날 대회의 설렘을 전한다.\n\n## 저마다의 속도로 함께 달리다\n\n운동장을 달리는 학생들의 걸음은 제각각이었다. 앞서 속도를 내는 학생도, 자신의 페이스를 유지하는 학생도 있었다. 순위뿐 아니라 완주를 향해 도전하고 함께 같은 코스를 달린 경험이 소중하게 남았다.\n\n## 결승선과 봄날의 기억\n\n마지막 구간을 달리는 학생들의 모습에는 완주를 향한 의지가 담겼다. 달리기를 마친 뒤에는 물과 간식을 나누며 휴식하는 장면도 있었다. 참가자들이 함께 찍은 단체사진은 2026년의 봄을 기록하는 한 장의 추억이 되었다.\n\n배부대에는 물과 음료, 간식이 놓였고, 주변 관람석에는 달리기를 마친 학생들이 앉아 쉬었다. 결승선을 지난 뒤의 풍경까지 사진에 담기며, 달리는 순간뿐 아니라 함께 쉬어 가는 시간도 이날의 기록으로 남았다.", "byline": "원고 작성자 미기재 · 웅비 편집실", "year": 2026, "status": "approved", "category": "학교 이야기", "photos": [{"id": "marathon-01", "sourceAsset": "assets/feature-marathon-2026/m-01.webp", "webPath": "assets/feature-marathon-2026/m-01.webp", "originalPath": "assets/feature-marathon-2026/m-01.webp", "caption": "행사에 참가한 학생과 교직원이 함께한 단체사진", "alt": "행사에 참가한 학생과 교직원이 함께한 단체사진", "after": -1, "credit": "포항고등학교 제공", "placeholder": false, "sample": false, "galleryPhase": "본문 사진"}, {"id": "marathon-02", "sourceAsset": "assets/feature-marathon-2026/m-02.webp", "webPath": "assets/feature-marathon-2026/m-02.webp", "originalPath": "assets/feature-marathon-2026/m-02.webp", "caption": "운동장에 모여 대회를 준비하는 참가자들", "alt": "운동장에 모여 대회를 준비하는 참가자들", "after": 0, "credit": "포항고등학교 제공", "placeholder": false, "sample": false, "galleryPhase": "본문 사진"}, {"id": "marathon-03", "sourceAsset": "assets/feature-marathon-2026/m-03.webp", "webPath": "assets/feature-marathon-2026/m-03.webp", "originalPath": "assets/feature-marathon-2026/m-03.webp", "caption": "운동장에서 함께 몸을 푸는 학생들", "alt": "운동장에서 함께 몸을 푸는 학생들", "after": 1, "credit": "포항고등학교 제공", "placeholder": false, "sample": false, "galleryPhase": "본문 사진"}, {"id": "marathon-0 p", "caption": "운동장 달리기 장면", "alt": "운동장 달리기 장면", "after": -1, "credit": "포항고등학교 제공", "placeholder": false, "sample": false, "galleryPhase": "하단 사진첩"}, {"id": "marathon-16", "sourceAsset": "assets/feature-marathon-2026/m-16.webp", "webPath": "assets/feature-marathon-2026/m-16.webp", "originalPath": "assets/feature-marathon-2026/m-16.webp", "caption": "학교 운동장의 마라톤 스케치", "alt": "학교 운동장의 마라톤 스케치", "after": -1, "credit": "포항고등학교 제공", "placeholder": false, "sample": false, "galleryPhase": "하단 사진첩"}, {"id": "marathon-17", "sourceAsset": "assets/feature-marathon-2026/m-17.webp", "webPath": "assets/feature-marathon-2026/m-17.webp", "originalPath": "assets/feature-marathon-2026/m-17.webp", "caption": "운동장에서 달리는 참가자들", "alt": "운동장에서 달리는 참가자들", "after": -1, "credit": "포항고등학교 제공", "placeholder": false, "sample": false, "galleryPhase": "하단 사진첩"}, {"id": "marathon-18", "sourceAsset": "assets/feature-marathon-2026/m-18.webp", "webPath": "assets/feature-marathon-2026/m-18.webp", "originalPath": "assets/feature-marathon-2026/m-18.webp", "caption": "마라톤 코스의 또 다른 순간", "alt": "마라톤 코스의 또 다른 순간", "after": -1, "credit": "포항고등학교 제공", "placeholder": false, "sample": false, "galleryPhase": "하단 사진첩"}, {"id": "marathon-19", "sourceAsset": "assets/feature-marathon-2026/m-19.webp", "webPath": "assets/feature-marathon-2026/m-19.webp", "originalPath": "assets/feature-marathon-2026/m-19.webp", "caption": "운동장과 학생들의 행사 모습", "alt": "운동장과 학생들의 행사 모습", "after": -1, "credit": "포항고등학교 제공", "placeholder": false, "sample": false, "galleryPhase": "하단 사진첩"}, {"id": "marathon-20", "sourceAsset": "assets/feature-marathon-2026/m-20.webp", "webPath": "assets/feature-marathon-2026/m-20.webp", "originalPath": "assets/feature-marathon-2026/m-20.webp", "caption": "운동장 16.jpg · 결승을 향해 달리는 학생들의 또 다른 모습", "alt": "운동장 16.jpg · 결승을 향해 달리는 학생들의 또 다른 모습", "after": -1, "credit": "포항고등학교 제공", "placeholder": false, "sample": false, "galleryPhase": "하단 사진첩"}], "publishedAt": "2026-10-23T10:51:00+09:00"}, {"id": "woonbi-warm-school-pork-2026", "title": "따뜻한 행복학교, 멱살 대신 목살", "deck": "학교폭력 예방을 일상으로 가져온 특별한 급식 캠페인", "body": "경상북도교육청의 ‘2026 학교폭력 제로 챌린지’ 사업의 하나로 기획된 이번 행사는 학생들이 거부감 없이 학교폭력 예방의 의미를 체득하도록 체험 중심으로 꾸며졌다.\n\n딱딱한 주입식 교육에서 벗어나 학생들의 눈높이에 맞춘 이색적인 학교폭력 예방 캠페인을 전개해 교육계의 주목을 받고 있다. 아침에 ‘멱살 대신 목살’ 식판이나 음식보다 먼저 학교폭력 예방 메시지를 펫말로 전하는 아침의 등교 모습을 보여 준다.\n\n언어유희를 활용해 ‘멱살 대신 목살’이라는 이름의 메뉴가 식탁에 올랐고, 학생들은 친구들과 음식을 나누며 배려와 존중의 가치를 자연스럽게 공유했다.\n\n교육 전문가들은 ‘징계와 처벌 중심의 사후 처방보다 이처럼 공감대를 형성하는 사전 예방 프로그램이 지역 청소년 범죄율 감소와 정서 안정에 실질적인 도움을 준다’고 분석했다.\n\n서로를 대하는 태도는 거창한 다짐뿐 아니라 매일 쓰는 말과 행동에서 드러난다. 캠페인은 그런 일상을 다시 생각하게 하는 한 방법이다. 누군가에게는 가볍게 넘기는 장면이 다른 사람에게는 불편할 수 있다는 점을 함께 돌아볼 수 있다.\n\n행사가 실제로 어떤 준비를 거쳤고 급식 프로그램과 어떻게 연결됐는지는 담당 학생의 취재가 더해질 부분이다. 현수막을 든 사람과 그 앞을 지나간 사람에게 각각 물어보면 캠페인이 어떻게 받아들여졌는지도 알 수 있다.\n\n## 편집부 보강 | 일상의 말과 행동에서 시작하는 예방\n\n학교폭력 예방은 특별한 행사를 진행하는 하루에만 필요한 일이 아니다. 친구가 불편해하는 농담을 멈추는 일, 도움이 필요한 친구에게 관심을 기울이는 일처럼 반복되는 작은 행동이 학교의 분위기를 만든다. 급식과 등교라는 익숙한 학교생활의 장면에 예방 메시지를 연결했다는 점은 이번 캠페인을 생각해 볼 만한 부분이다.\n\n다만 캠페인의 실제 효과나 학생들의 반응을 확인하려면 참여자와 담당자의 추가 취재가 필요하다. 따뜻한 학교의 출발점은 거창한 구호에 머무르지 않고 서로를 존중하는 일상에 있을 것이다.\n\n## 편집부 현장사진 보강 | 등굣길에 전한 예방 메시지\n\n5월 8일 캠페인의 기록에는 학교 입구에서 현수막과 피켓을 든 학생들의 모습이 담겼다. 피켓에는 ‘관심과 예방으로 학교폭력 제로로!’라는 문구가 적혀 있었다. 등교하는 학생들이 오가는 길목에서 전한 짧은 메시지는 학교폭력 예방을 일상의 말과 행동으로 이어 가자는 뜻을 눈에 보이게 했다.", "byline": "김도윤 기자", "year": 2026, "status": "approved", "category": "학교 이야기", "photos": [{"id": "pork-campaign-20260508-3", "sourceAsset": "https://firebasestorage.googleapis.com/v0/b/woonbi-webzine-2026.firebasestorage.app/o/public%2Flegacy-enrichment-20261026%2Fpork-3-174700dad1d2.jpg?alt=media&token=6aa0e90a-deac-4b42-a3b3-dd16eec46bde", "webPath": "https://firebasestorage.googleapis.com/v0/b/woonbi-webzine-2026.firebasestorage.app/o/public%2Flegacy-enrichment-20261026%2Fpork-3-174700dad1d2.jpg?alt=media&token=6aa0e90a-deac-4b42-a3b3-dd16eec46bde", "originalPath": "https://firebasestorage.googleapis.com/v0/b/woonbi-webzine-2026.firebasestorage.app/o/public%2Flegacy-enrichment-20261026%2Fpork-3-174700d "2026-10-23T10:52:00+09:00"}, {"id": "woonbi-ai-business-kimdy-20261023", "title": "생성형 AI 시대, 미래 경영학의 패러다임 변화", "deck": "데이터 처리에서 전략적 통찰로, 경영자의 역할은 어떻게 바뀌는가", "body": "원고 작성일: 2025년 10월 9일\n\n생성형 AI 시대, 미래 경영학의 패러다임 변화 데이터 처리 과정에서 전략적인 통찰로 최근 생성형 AI 기술의 급격한 발전이 산업 전반을 흔들면서 기업의 경영 형태도 전환점을 맞이하고 있다. 과거의 경영학이 효율적인 자원 배분과 데이터 분석에 집중했다면, 생성형 AI가 도입된 미래 경영학은 기술 활용 능력과 전략적 통찰과 윤리적 리더십을 조화하는 쪽으로 발전하고 있다. 초개인화 마케팅과 데이터 기반 의사결정의 혁신 생성형 AI는 마케팅과 시장 분석 분야에서 강력한 성능을 발휘한다. 기존에는 수개월이 걸리던 소비자 반응 분석과 타깃 마케팅 문구,이미지 생성이 실시간에 가깝게 이루어지고 있다. 경영진은 복잡한 시장 변수를 AI로 신속하게 가정함으로써 데이터 기반의 신속하고 정교한 의사결정을 내릴 수 있게 되었다. 그리고 과거 상당한 시간과 인력이 소요되던 업무들이 AI에 의해 자동화되고 있다. 이에 따라 미래 경영자에게 요구되는 핵심 역량은 단순 실무 능력이 아닌 AI에게 올바른 맥락의 질문을 던지는 능력과 AI가 출력한 결과의 오류나 잘못된 정보를 비판적으로 검증하는 판단력으로 옮겨지고 있다.\n\n최근 AI의 광범위한 도입은 데이터 저작권, 개인정보 침해, 알고리즘 편향성, 일자리 대체 등 새로운 윤리적 문제를 초래 할 수 있다. 미래 경영학은 단순히 기업의 이익 극대화만을 목표로 하지 않으며, A I 도입 과정에서 발생하는 사회적 영향과 윤리적 리스크를 관리하는 ESG 경영과의 연계성을 점차 강화하고 있다.\n\n앞으로의 경영학에서는 단순 기술 이용자를 넘어, 기술을 조직의 초점에 맞춰 전략적으로 배치하고 인본주의적 가치를 지켜내는 경영학자로 성장해야 할 것이다.\n\n## 편집부 보강 | 기술의 속도보다 중요한 경영 판단\n\n생성형 AI가 소비자 반응을 빠르게 정리하거나 홍보 문구를 제안할 수 있다고 해도, 어떤 결과를 실제 경영에 사용할지는 사람이 결정해야 한다. 이용자의 개인정보를 적절히 보호하는지, 특정 집단을 부당하게 배제하는지, 사실과 다른 내용을 생성하지는 않았는지 점검할 책임이 있다.\n\n예를 들어 고객별 맞춤 광고를 자동으로 제작하는 일은 기술이 도울 수 있지만, 그 광고가 소비자에게 충분한 정보를 제공하고 있는지는 별개의 문제다. 미래 경영자는 기술을 적용할 상황과 적용하지 말아야 할 상황을 구분할 수 있어야 한다. 따라서 학생 원고의 핵심 주장인 전략적 통찰과 윤리적 리더십은 AI 시대에도 중요한 판단 기준이 된다.", "byline": "김도윤 기자", "year": 2026, "status": "approved", "category": "학생 글", "photos": [{"id": "user-woonbi-ai-business-kimdy-20261023-0", "sourceAsset": "assets/research-20261021/ai-1.webp", "webPath": "assets/research-20261021/ai-1.webp", "originalPath": "assets/research-20261021/ai-1.webp", "caption": "자료사진 · 냉각 장치를 갖춘 GPU 서버 자료사진. 매끄러운 답변 뒤에는 대규모 계산을 수행하는 물리적 장치가 있다.", "alt": "자료사진 · 냉각 장치를 갖춘 GPU 서버 자료사진. 매끄러운 답변 뒤에는 대규모 계산을 수행하는 물리적 장치가 있다.", "after": -1, "placeholder": false, "sample": false, "credit": "Steve Jurvetson · CC BY 4.0 · 축소·WebP", "sourcePage": "https://commons.w  지금 이 순간에도 차츰 늘어나고 있다. 해가 더해질수록, 더해질수록. 그 이유야 분명하다. 자칭 pc주의자들의 온갖 만행들이 있었지 않은가? 극단주의자들의 만행을 우리는 목격해오지 않았던가? 그들이 올바름이란 말 뒤에 숨어 정당화해왔던 억지들. pc에 대한 요즈음의 분노는 그럼으로 정당해 보인다. 하지만 생각해보자. pc는 죽었다. 분명히. 그렇지만 그것은 죽어서는 안 되는 것이 아니던가? 올바름이란 죽어서는 안 되는 가치가 아니던가? 올바름이 죽어 그 모든 부정함이 긍정되는 일은 없어야 함이 아닌가? pc는 죽었다. pc주의자들 스스로가 죽였다. 우리는 그러나 그것이 죽어가도록 두어서는 안 된다.\n\npc의 죽음을, 그리고 그 재생을 논함에 있어 창작물에서의 pc를 빼놓고 말할 수도 없을 것이다. pc가 죽어가게 된 데에 가장 큰 비중을 차지하게 된 데에는 분명 이야기가 존재한다(생각해보면 우스운 일인데, 예로부터 이야기란 가장 거부감이 덜한 형태로 사상을 주입하는 수단이었다). pc주의자들의 이야기가 실패한 데에는 결국에 그런 이유가 있었다. 서사에 메시지가 앞선다는 것. 서사를 메시지의 들러리로 전락시켰다는 것. 서사에 우선해 메시지가 눈에 띈다는 것이다. 인물은 피켓이 되고, 완결성은 조각난다. 그 결과, 아직 올바름의 진정한 가치를 접해보지도 못한 어린 세대에게 'PC'는 이해의 대상이 아닌 밈과 희화화, 왜곡된 선입견의 대상으로 추락하고 말았다. 게으른 서사가 올바름 그 자체를 거부하게 만든 것이다.그렇다면 이대로 올바름을 죽은 채 방치할 것인가? 아니다. 죽어버린 올바름을 다시 세우고, 밈으로 추락한 가치를 부활시켜야 한다. 메시지의 뒤에 숨어 설교하는 게으름을 털어내고, 서사를 회복해야 한다. pc를 조롱하는 것에 그치지 않고, 한발 더 나아가, 되찾아야 한다. 그릇된 방향으로 나아가는 pc를 원래의 방향으로 틀어주어야 한다. 메시지를 가르치려 들지 않고, 이야기가 스스로 이야기답게 숨 쉬게 만드는 것. 올바름을 다시 써 내려가는 것. 그것이 지금 우리에게 주어진 과제이며, 부과된 의무다.\n\n## 편집부 해설 | 가치에 대한 논의와 작품의 완성도는 구별할 수 있다\n\n이 글의 ‘PC는 죽었다’는 표현은 필자가 정치적 올바름의 대중적 이미지를 비평하기 위해 사용한 주장이다. 사회에서 차별을 줄이고 존중을 실천해야 한다는 가치가 객관적으로 소멸했다는 뜻은 아니다. 작품에 사회적 메시지가 담겼다는 이유만으로 서사적 완성도가 낮아지는 것도 아니며, 이야기의 구조를 비판한다고 해서 그 가치 전체를 부정하는 것도 아니다.\n\n어떤 작품의 인물과 갈등이 설득력 있게 그려졌는지, 주제가 사건과 선택 속에서 자연스럽게 드러나는지 개별 사례를 통해 검토할 필요가 있다. 이처럼 가치와 표현 방식을 나누어 읽을 때 논설의 문제 제기도 더 생산적인 토론으로 이어질 수 있다.", "byline": "필자 미기재 · 학생 칼럼", "year": 2026, "status": "approved", "category": "학생 글", "photos": [{"id": "user-woonbi-pc-opinion-20261023-0", "sourceAsset": "assets/research-20261021/editing-1.webp", "webPath": "assets/research-20261021/editing-1.webp", "originalPath": "assets/research-20261021/editing-1.webp", "caption": "자료사진 · KEXP의 영상 편집실 자료사진. 같은 촬영본도 어떤 장면을 고르는지에 따라 다른 이야기로 구성된다.", "alt": "자료사진 · KEXP의 영상 편집실 자료사진. 같은 촬영본도 어떤 장면을 고르는지에 따라 다른 이야기로 구성된다.", "after": -1, "placeholder": false, "sample": false, "credit": "Joe Mabel · CC BY-SA 4.0 · 축소·WebP", "sourcePage": "https://comm
