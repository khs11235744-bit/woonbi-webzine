1023.js"></script><script src="js/feature-article-notes-20261023.js"></script><script src="js/book-source-2026.js"></script><script src="js/book-layout-2026.js"></script><script>const h=(tag,attrs,text)=>{const e=document.createElement(tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,v);e.textContent=text;return e;};
function inlineArticleText(text){
 const nodes=[],pattern=/(?<!\\)\[([^\]\n\\]{1,200})\]\((https?:\/\/[^\s()]{1,2048})\)/g;
 let cursor=0,match;const source=String(text||'');
 while((match=pattern.exec(source))){
  if(match.index>cursor)nodes.push(document.createTextNode(source.slice(cursor,match.index)));
  if(match[1]){
   let url;try{url=new URL(match[2]);}catch{}
   if(url&&['http:','https:'].includes(url.protocol)&&!url.username&&!url.password)
    nodes.push(h('a',{href:url.href,target:'_blank',rel:'noopener noreferrer'},match[1]));
   else nodes.push(document.createTextNode(match[0]));
  }
  cursor=pattern.lastIndex;
 }
 if(cursor<source.length)nodes.push(document.createTextNode(source.slice(cursor)));
 return nodes;
}

(async()=>{
 const cfg=window.WOONBI_CONFIG.firebase;
 const decode=v=>{if(!v||typeof v!=='object')return null;for(const k of ['stringValue','timestampValue','booleanValue'])if(k in v)return v[k];for(const k of ['integerValue','doubleValue'])if(k in v)return Number(v[k]);if('arrayValue'in v)return(v.arrayValue.values||[]).map(decode);if('mapValue'in v)return Object.fromEntries(Object.entries(v.mapValue.fields||{}).map(([k,x])=>[k,decode(x)]));return null;};
 async function listPublic(){const url='https://firestore.googleapis.com/v1/projects/'+encodeURIComponent(cfg.projectId)+'/databases/(default)/documents/publications?pageSize=100&key='+encodeURIComponent(cfg.apiKey);const response=await fetch(url,{credentials:'omit',cache:'no-store',signal:AbortSignal.timeout(15000)});if(!response.ok)throw Error('공개 원문 조회 실패 HTTP '+response.status);const data=await response.json();if(data.nextPageToken)throw Error('추가 공개 목록이 있어 전체 확인이 필요합니다.');return(data.documents||[]).map(d=>({...Object.fromEntries(Object.entries(d.fields||{}).map(([k,v])=>[k,decode(v)])),id:d.name.split('/').pop()}));}
 const data=await Woonbi.bookSource2026.load({listPublic,buildCatalogue:rows=>Woonbi.editionContent.build(rows)});if(!data.complete)throw Error(data.errors.join(' / '));
 const issue=Woonbi.bookSource2026.snapshot(data,'웅비 · 2026 학교의 기록');
 const node=await Woonbi.bookLayout2026.preview(issue,{renderText:inlineArticleText,imageNode:async p=>{const img=document.createElement('img');const src=p.sourceAsset||p.webPath;img.src=src.startsWith('public/')?'https://firebasestorage.googleapis.com/v0/b/'+encodeURIComponent(cfg.storageBucket)+'/o/'+encodeURIComponent(src)+'?alt=media':src;img.alt=p.alt||p.caption||'';return img;}});
 document.getElementById('result').replaceChildren(node);document.getElementById('sourceCounts').textContent=data.counts.articles+'편 / '+data.counts.photos+'장 / 본문 '+data.counts.characters+'자 · 익명 공개 원문';const proof=document.getElementById('proof');proof.disabled=false;proof.addEventListener('click',()=>Woonbi.bookLayout2026.printProof(document.querySelector('.book26-preview')).catch(e=>alert(e.message)));
})().catch(e=>document.getElementById('result').textContent=e.message);
