name: KHS Bridge Upgrade Helper
on:
  push:
    branches: [main]
    paths:
      - "KHS_REMOTE/bridge_upgrade_request.json"

permissions:
  contents: write

jobs:
  preserve-legacy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Preserve current INDIE bridge implementation
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f KHS_REMOTE/local_bridge_indie_legacy.ps1 ]; then
            cp KHS_REMOTE/local_bridge.ps1 KHS_REMOTE/local_bridge_indie_legacy.ps1
          fi
      - name: Commit preserved worker
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "KHS Bridge Upgrade"
          git config user.email "khs-bridge-upgrade@users.noreply.github.com"
          git add KHS_REMOTE/local_bridge_indie_legacy.ps1
          if git diff --cached --quiet; then
            echo "No preservation change needed"
            exit 0
          fi
          git commit -m "KHS_BRIDGE: preserve legacy INDIE worker"
          git pull --rebase origin main
          git push origin HEAD:main
