name: Early Heat Radar Remote
on:
  push:
    branches: [main]
    paths:
      - "KHS_REMOTE/earlyheat_jobs/*.json"
  workflow_dispatch:
    inputs:
      job_path:
        description: "Early Heat Radar job JSON path"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: khs-earlyheat-status
  cancel-in-progress: false

jobs:
  route:
    runs-on: ubuntu-latest
    outputs:
      job: ${{ steps.job.outputs.job }}
      action: ${{ steps.job.outputs.action }}
      agent_mode: ${{ steps.job.outputs.agent_mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Resolve Early Heat job
        id: job
        shell: bash
        env:
          INPUT_JOB_PATH: ${{ github.event.inputs.job_path || '' }}
        run: |
          if [ -n "$INPUT_JOB_PATH" ]; then
            job="$INPUT_JOB_PATH"
          else
            job="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep '^KHS_REMOTE/earlyheat_jobs/.*\.json$' | head -n 1 || true)"
          fi
          [ -n "$job" ] || { echo "Early Heat job file not found"; exit 1; }
          case "$job" in KHS_REMOTE/earlyheat_jobs/*.json) ;; *) echo "Invalid job: $job"; exit 1;; esac
          action="$(jq -r '.action // ""' "$job")"
          agent_mode="$(jq -r '.agent_mode // false' "$job")"
          case "$action" in status|earlyheat_codex) ;; *) echo "Unsupported action: $action"; exit 1;; esac
          echo "job=$job" >> "$GITHUB_OUTPUT"
          echo "action=$action" >> "$GITHUB_OUTPUT"
          echo "agent_mode=$agent_mode" >> "$GITHUB_OUTPUT"

  status:
    needs: route
    if: needs.route.outputs.action == 'status'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 3
        with:
          fetch-depth: 2
      - name: Execute read-only Early Heat status
        shell: powershell
        run: |
          Set-ExecutionPolicy -Scope Process Bypass -Force
          $cmdPath = Join-Path $env:GITHUB_WORKSPACE ("${{ needs.route.outputs.job }}" -replace '/', '\')
          .\KHS_REMOTE\earlyheat_dispatcher.ps1 -CmdPath $cmdPath
      - name: Commit status result
        if: always()
        shell: powershell
        run: |
          git config user.name "KHS EarlyHeat Status"
          git config user.email "khs-earlyheat-status@users.noreply.github.com"
          if (Test-Path "KHS_REMOTE/results/earlyheat") {
            git add KHS_REMOTE/results/earlyheat
            git diff --cached --quiet
            $diffExit=$LASTEXITCODE
            if ($diffExit -eq 1) {
              git commit -m "KHS_EARLYHEAT_STATUS: $env:GITHUB_RUN_ID"
              if ($LASTEXITCODE -ne 0) { throw "git commit failed" }
              $pushed=$false
              for ($i=1; $i -le 5 -and -not $pushed; $i++) {
                git pull --rebase origin main
                if ($LASTEXITCODE -eq 0) {
                  git push origin HEAD:main
                  if ($LASTEXITCODE -eq 0) { $pushed=$true }
                }
                if (-not $pushed) { git rebase --abort 2>$null; Start-Sleep -Seconds (2*$i) }
              }
              if (-not $pushed) { throw "result push failed" }
            } elseif ($diffExit -ne 0) { throw "git diff failed" }
          }

  codex_mailbox:
    needs: route
    if: needs.route.outputs.action == 'earlyheat_codex'
    runs-on: ubuntu-latest
    steps:
      - name: Hold coding job for dedicated EarlyHeat agent
        shell: bash
        run: |
          echo "Early Heat coding is NOT executed on a shared self-hosted runner."
          echo "Job: ${{ needs.route.outputs.job }}"
          echo "Dedicated agent mode: ${{ needs.route.outputs.agent_mode }}"
          if [ "${{ needs.route.outputs.agent_mode }}" != "true" ]; then
            echo "This coding request is not marked agent_mode=true; it will remain unexecuted."
          fi
