name: KHS Mini-Jev Sidecar Consumer
on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

concurrency:
  group: khs-minijev-sidecar-consumer
  cancel-in-progress: false

jobs:
  consume:
    runs-on: [self-hosted, Windows, X64, khs-minijev]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 3
        with:
          fetch-depth: 2

      - name: Consume one Mini-Jev sidecar request
        shell: powershell
        run: |
          $cmd = @{
            request_id = "sidecar-poll-$env:GITHUB_RUN_ID"
            project = "KHS_MINI_JEV"
            action = "sidecar_consume"
          } | ConvertTo-Json -Depth 6

          $cmdPath = Join-Path $env:RUNNER_TEMP "khs-minijev-sidecar-consume.json"
          [IO.File]::WriteAllText($cmdPath,$cmd,(New-Object Text.UTF8Encoding($false)))

          Set-ExecutionPolicy -Scope Process Bypass -Force
          .\KHS_REMOTE\minijev_dispatcher.ps1 -CmdPath $cmdPath

      - name: Commit non-idle sidecar result
        shell: powershell
        run: |
          $latest = "KHS_REMOTE/results/minijev/latest.json"
          if (-not (Test-Path $latest)) { exit 0 }

          $r = Get-Content $latest -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($r.status -eq "IDLE") {
            Write-Host "No READY sidecar request."
            exit 0
          }

          git config user.name "KHS Mini-Jev Sidecar"
          git config user.email "khs-minijev-sidecar@users.noreply.github.com"
          git add KHS_REMOTE/results/minijev
          git diff --cached --quiet
          $diffExit = $LASTEXITCODE
          if ($diffExit -eq 1) {
            git commit -m "KHS_SIDECAR_RESULT: $env:GITHUB_RUN_ID"
            if ($LASTEXITCODE -ne 0) { throw "git commit failed" }
            git pull --rebase origin main
            if ($LASTEXITCODE -ne 0) { throw "git pull --rebase failed" }
            git push origin HEAD:main
            if ($LASTEXITCODE -ne 0) { throw "git push failed" }
          } elseif ($diffExit -ne 0) {
            throw "git diff --cached --quiet failed: $diffExit"
          }
