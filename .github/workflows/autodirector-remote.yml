name: AutoDirector Remote Control
on:
  push:
    branches: [main]
    paths:
      - "KHS_REMOTE/autodirector_jobs/**/*.json"
  workflow_dispatch:
    inputs:
      job_path:
        description: "AutoDirector job JSON path"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: autodirector-remote-control
  cancel-in-progress: false

jobs:
  autodirector:
    # Reuse the already-online Windows runner service. The dispatcher below still
    # hard-bounds all file and command access to the local AutoDirector folder.
    runs-on: [self-hosted, Windows, X64, khs-indie]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Resolve AutoDirector job file
        id: job
        shell: powershell
        env:
          KHS_JOB_PATH: ${{ github.event.inputs.job_path || '' }}
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:KHS_JOB_PATH)) {
            $job = $env:KHS_JOB_PATH
          } else {
            $changed = @(& git diff-tree --no-commit-id --name-only -r $env:GITHUB_SHA)
            $job = $changed | Where-Object { $_ -like "KHS_REMOTE/autodirector_jobs/*.json" } | Select-Object -First 1
            if (-not $job) {
              Write-Host "Changed files:"
              $changed | ForEach-Object { Write-Host $_ }
              throw "AutoDirector job file not found in triggering commit"
            }
          }
          if ($job -notlike "KHS_REMOTE/autodirector_jobs/*.json") { throw "Invalid AutoDirector job path: $job" }
          "job=$job" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Execute bounded AutoDirector command
        shell: powershell
        run: |
          Set-ExecutionPolicy -Scope Process Bypass -Force
          $cmdPath = Join-Path $env:GITHUB_WORKSPACE ("${{ steps.job.outputs.job }}" -replace '/', '\')
          .\KHS_REMOTE\autodirector_dispatcher.ps1 -CmdPath $cmdPath
      - name: Commit real result
        if: always()
        shell: powershell
        run: |
          git config user.name "KHS AutoDirector Runner"
          git config user.email "khs-autodirector-runner@users.noreply.github.com"
          if (Test-Path "KHS_REMOTE/autodirector_results") {
            git add KHS_REMOTE/autodirector_results
            git diff --cached --quiet
            $diffExit = $LASTEXITCODE
            if ($diffExit -eq 1) {
              git commit -m "AUTODIRECTOR_RESULT: $env:GITHUB_RUN_ID"
              if ($LASTEXITCODE -ne 0) { throw "git commit failed" }
              git pull --rebase origin main
              if ($LASTEXITCODE -ne 0) { throw "git pull --rebase failed" }
              git push origin HEAD:main
              if ($LASTEXITCODE -ne 0) { throw "git push failed" }
            } elseif ($diffExit -ne 0) {
              throw "git diff --cached --quiet failed: $diffExit"
            }
          }
