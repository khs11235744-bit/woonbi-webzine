name: Woonbi v0.6 checks — no deployment
on:
  push:
    branches: [woonbi-webzine-v0.6]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: woonbi-v06-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and JSON
        run: npm run check
      - name: Domain and editorial tests
        run: npm test
