name: Woonbi school life refresh

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: woonbi-production
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test preservation of published articles and photos
        run: node --test tests/hosting-data-refresh.test.cjs

      - id: auth
        name: Authenticate to Google Cloud with OIDC
        uses: google-github-actions/auth@v3
        with:
          project_id: woonbi-webzine-2026
          workload_identity_provider: projects/285370921993/locations/global/workloadIdentityPools/woonbi-github/providers/github
          service_account: woonbi-github-deploy@woonbi-webzine-2026.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform

      - name: Refresh and validate school information only
        env:
          NEIS_API_KEY: ${{ secrets.NEIS_API_KEY }}
        run: |
          node scripts/fetch-school-life.mjs --out="$RUNNER_TEMP/school-life.json"
          node scripts/validate-school-life.cjs "$RUNNER_TEMP/school-life.json"

      - name: Preserve live articles and photos while replacing school data
        env:
          WOONBI_HOSTING_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: node scripts/refresh-hosting-school-life.cjs "$RUNNER_TEMP/school-life.json"
