name: Woonbi reviewed preserving preview
on:
  push:
    branches: [woonbi-reviewed-policy-20261026]
    paths:
      - '.github/workflows/woonbi-preserved-preview.yml'
      - 'scripts/preserved-hosting.cjs'
      - 'scripts/stage-preview.cjs'
      - 'tests/preserved-hosting.test.cjs'
      - 'release-bundle/**'
permissions:
  contents: read
  id-token: write
concurrency:
  group: woonbi-production
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test preservation boundaries before authentication
        run: node --test tests/preserved-hosting.test.cjs
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: woonbi-webzine-2026
          workload_identity_provider: projects/285370921993/locations/global/workloadIdentityPools/woonbi-github/providers/github
          service_account: woonbi-github-deploy@woonbi-webzine-2026.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform
          create_credentials_file: false
          export_environment_variables: false
      - name: Stage exact reviewed code and short-lived preview; never publish live
        env:
          WOONBI_HOSTING_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: node scripts/stage-preview.cjs release-bundle
      - name: Retain manifest and rollback pointer only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: woonbi-release-receipt-${{ github.run_id }}
          path: release-receipt/*.json
          if-no-files-found: ignore
          retention-days: 3
