name: AutoDirector Cancel Stale Runner Job
on:
  push:
    branches: [main]
    paths:
      - "KHS_REMOTE/autodirector_cancel/*.json"
permissions:
  actions: write
  contents: read
jobs:
  cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Cancel requested stale AutoDirector run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          changed=$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep '^KHS_REMOTE/autodirector_cancel/.*\.json$' | head -n 1)
          test -n "$changed"
          run_id=$(jq -r '.run_id' "$changed")
          case "$run_id" in (*[!0-9]*|'') echo "invalid run_id" >&2; exit 2;; esac
          code=$(curl --silent --show-error --max-time 15 -o /tmp/cancel.out -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/runs/${run_id}/cancel" || true)
          cat /tmp/cancel.out || true
          echo "cancel request HTTP ${code} for ${run_id}"
          test "$code" = "202" -o "$code" = "409"
