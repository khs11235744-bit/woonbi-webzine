name: INDI+P auto refresh command

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: indip-auto-refresh-command
  cancel-in-progress: true

jobs:
  queue-latest-refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Write latest phone-bridge command
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib, datetime
          now = datetime.datetime.now(datetime.timezone.utc)
          rid = "indie-auto-refresh-" + now.strftime("%Y%m%d-%H%M%S")
          payload = {
            "request_id": rid,
            "project": "INDIE",
            "action": "indieplus_sync_deploy",
            "confirm_deploy": True,
            "include_functions": False,
            "requested_by": "github-actions-scheduler",
            "requested_at": now.isoformat()
          }
          path = pathlib.Path("KHS_REMOTE/command.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(payload)
          PY

      - name: Commit latest command
        shell: bash
        run: |
          git config user.name "KHS Auto Scheduler"
          git config user.email "khs-auto-scheduler@users.noreply.github.com"
          git add KHS_REMOTE/command.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "KHS_AUTO: queue latest INDI+P refresh"
          for n in 1 2 3 4; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort || true
            sleep $((n*2))
          done
          exit 1
