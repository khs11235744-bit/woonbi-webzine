name: KHS INDIE Remote
on:
  push:
    branches: [main]
    paths:
      - "KHS_REMOTE/indie_jobs/**/*.json"
  workflow_dispatch:
    inputs:
      job_path:
        description: "KHS INDIE job JSON path"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: khs-indie-remote
  cancel-in-progress: false

jobs:
  indie:
    runs-on: [self-hosted, Windows, X64, khs-indie]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Resolve INDIE job file
        id: job
        shell: powershell
        env:
          INPUT_JOB_PATH: ${{ github.event.inputs.job_path || '' }}
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:INPUT_JOB_PATH)) {
            $job = $env:INPUT_JOB_PATH
          } else {
            $changed = @(& git diff-tree --no-commit-id --name-only -r $env:GITHUB_SHA)
            $job = $changed | Where-Object { $_ -like "KHS_REMOTE/indie_jobs/*.json" } | Select-Object -First 1
          }
          if (-not $job) { throw "INDIE job file not found" }
          if ($job -notlike "KHS_REMOTE/indie_jobs/*.json") { throw "Invalid INDIE job path: $job" }
          "job=$job" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Execute bounded INDIE command
        shell: powershell
        env:
          KHS_JOB_PATH: ${{ steps.job.outputs.job }}
        run: |
          Set-ExecutionPolicy -Scope Process Bypass -Force
          .\KHS_REMOTE\dispatcher.ps1
      - name: Commit real result
        if: always()
        shell: powershell
        run: |
          git config user.name "KHS INDIE Runner"
          git config user.email "khs-indie-runner@users.noreply.github.com"
          if (Test-Path "KHS_REMOTE/results/indie") {
            git add KHS_REMOTE/results/indie
            git diff --cached --quiet
            $diffExit = $LASTEXITCODE
            if ($diffExit -eq 1) {
              git commit -m "KHS_INDIE_RESULT: $env:GITHUB_RUN_ID"
              if ($LASTEXITCODE -ne 0) { throw "git commit failed" }
              $pushed = $false
              for ($attempt = 1; $attempt -le 6 -and -not $pushed; $attempt++) {
                git fetch origin main
                if ($LASTEXITCODE -ne 0) { throw "git fetch failed" }
                git rebase origin/main
                if ($LASTEXITCODE -ne 0) {
                  git rebase --abort 2>$null
                  throw "git rebase failed"
                }
                git push origin HEAD:main
                if ($LASTEXITCODE -eq 0) {
                  $pushed = $true
                } else {
                  Start-Sleep -Seconds (2 * $attempt)
                }
              }
              if (-not $pushed) { throw "git push failed after retries" }
            } elseif ($diffExit -ne 0) {
              throw "git diff --cached --quiet failed: $diffExit"
            }
          }
