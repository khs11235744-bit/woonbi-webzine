name: KHS Runner Inventory
on:
  push:
    branches: [main]
    paths:
      - "KHS_MAINTENANCE/runner_inventory/*.json"

permissions:
  actions: read
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture runner inventory
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p KHS_REMOTE
          set +e
          HTTP_CODE=$(curl -sS -o /tmp/runners.json -w "%{http_code}"             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runners")
          RC=$?
          set -e
          if [ "$RC" -ne 0 ]; then
            printf '{"captured_at":"%s","ok":false,"curl_exit":%s,"http_code":"%s","error":"runner inventory curl failed"}\n'               "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$RC" "$HTTP_CODE" > KHS_REMOTE/runner_status.json
          elif [ "$HTTP_CODE" != "200" ]; then
            python - <<'PY'
import json, datetime
try:
    raw=open('/tmp/runners.json','r',encoding='utf-8').read()
except Exception as e:
    raw=str(e)
out={"captured_at":datetime.datetime.now(datetime.timezone.utc).isoformat(),
     "ok":False,"http_code":"$HTTP_CODE","response":raw[:4000]}
open('KHS_REMOTE/runner_status.json','w',encoding='utf-8').write(json.dumps(out,ensure_ascii=False,indent=2))
PY
          else
            jq '{
              captured_at: (now | todateiso8601),
              ok: true,
              total_count,
              runners: [.runners[] | {
                id, name, os, status, busy,
                labels: [.labels[].name]
              }]
            }' /tmp/runners.json > KHS_REMOTE/runner_status.json
          fi
      - name: Commit inventory result
        shell: bash
        run: |
          git config user.name "KHS Runner Inventory"
          git config user.email "khs-runner-inventory@users.noreply.github.com"
          git add KHS_REMOTE/runner_status.json
          git diff --cached --quiet && exit 0
          git commit -m "KHS_RUNNER_STATUS: ${GITHUB_RUN_ID}"
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i*2))
          done
          exit 1
