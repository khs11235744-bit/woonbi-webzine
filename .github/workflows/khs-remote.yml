name: KHS Mini-Jev Remote
on:
  push:
    branches: [main]
    paths:
      - "KHS_REMOTE/minijev_jobs/**/*.json"
  workflow_dispatch:
    inputs:
      job_path:
        description: "KHS Mini-Jev job JSON path"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: khs-minijev-remote
  cancel-in-progress: false

jobs:
  khs:
    runs-on: [self-hosted, Windows, X64, khs-minijev]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 3
        with:
          fetch-depth: 2
      - name: Resolve Mini-Jev job file
        id: job
        shell: powershell
        env:
          INPUT_JOB_PATH: ${{ github.event.inputs.job_path || '' }}
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:INPUT_JOB_PATH)) {
            $job = $env:INPUT_JOB_PATH
          } else {
            $changed = @(& git diff-tree --no-commit-id --name-only -r $env:GITHUB_SHA)
            $job = $changed | Where-Object { $_ -like "KHS_REMOTE/minijev_jobs/*.json" } | Select-Object -First 1
          }
          if (-not $job) { throw "Mini-Jev job file not found" }
          if ($job -notlike "KHS_REMOTE/minijev_jobs/*.json") { throw "Invalid Mini-Jev job path: $job" }
          "job=$job" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Execute bounded Mini-Jev command
        shell: powershell
        run: |
          Set-ExecutionPolicy -Scope Process Bypass -Force
          $cmdPath = Join-Path $env:GITHUB_WORKSPACE ("${{ steps.job.outputs.job }}" -replace '/', '\')
          .\KHS_REMOTE\minijev_dispatcher.ps1 -CmdPath $cmdPath
      - name: Commit real result
        if: always()
        shell: powershell
        run: |
          git config user.name "KHS Remote Runner"
          git config user.email "khs-remote-runner@users.noreply.github.com"
          if (Test-Path "KHS_REMOTE/results/minijev") {
            # This is the disposable GitHub Actions checkout, not the user's project repo.
            # Clear only stale rebase metadata left by a previous failed result push.
            git rebase --abort 2>$null
            Remove-Item ".git\rebase-merge",".git\rebase-apply" -Recurse -Force -ErrorAction SilentlyContinue

            git add KHS_REMOTE/results/minijev
            git diff --cached --quiet
            $diffExit = $LASTEXITCODE
            if ($diffExit -eq 1) {
              git commit -m "KHS_RESULT: $env:GITHUB_RUN_ID"
              if ($LASTEXITCODE -ne 0) { throw "git commit failed" }

              $pushed = $false
              for ($i=1; $i -le 3 -and -not $pushed; $i++) {
                git fetch origin main
                if ($LASTEXITCODE -ne 0) { Start-Sleep -Seconds 2; continue }

                git rebase origin/main
                if ($LASTEXITCODE -ne 0) {
                  git rebase --abort 2>$null
                  Remove-Item ".git\rebase-merge",".git\rebase-apply" -Recurse -Force -ErrorAction SilentlyContinue
                  Start-Sleep -Seconds 2
                  continue
                }

                git push origin HEAD:main
                if ($LASTEXITCODE -eq 0) {
                  $pushed = $true
                } else {
                  Start-Sleep -Seconds 2
                }
              }
              if (-not $pushed) { throw "result push failed after 3 attempts" }
            } elseif ($diffExit -ne 0) {
              throw "git diff --cached --quiet failed: $diffExit"
            }
          }
