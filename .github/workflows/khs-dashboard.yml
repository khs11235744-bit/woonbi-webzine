name: KHS Remote Dashboard
on:
  workflow_run:
    workflows:
      - "KHS Mini-Jev Remote"
      - "KHS INDIE Remote"
      - "AutoDirector Remote Control"
    types: [requested, in_progress, completed]
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh dashboard issue
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const dashboardIssue = 2;

            let runners = [];
            try {
              runners = await github.paginate(
                github.rest.actions.listSelfHostedRunnersForRepo,
                { owner, repo, per_page: 100 }
              );
            } catch (e) {
              core.warning('Runner list unavailable: ' + e.message);
            }

            const desiredRunners = [
              { name: 'KHS-MINIJEV', project: 'Mini-Jev' },
              { name: 'KHS-INDIE', project: 'INDIE' },
              { name: 'KHS-AUTODIRECTOR', project: 'AutoDirector' }
            ];

            const allRuns = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              { owner, repo, per_page: 100 }
            );

            const workflowMap = {
              'Mini-Jev': 'KHS Mini-Jev Remote',
              'INDIE': 'KHS INDIE Remote',
              'AutoDirector': 'AutoDirector Remote Control'
            };

            function statusIcon(status, conclusion) {
              if (status === 'in_progress') return '🟡';
              if (status === 'queued' || status === 'pending' || status === 'requested') return '🟠';
              if (status === 'completed' && conclusion === 'success') return '🟢';
              if (status === 'completed' && conclusion === 'cancelled') return '⚪';
              if (status === 'completed') return '🔴';
              return '⚪';
            }

            const runnerRows = desiredRunners.map(item => {
              const r = runners.find(x => x.name === item.name);
              if (!r) return '| ' + item.project + ' | ' + item.name + ' | 🔴 미등록/오프라인 | - |';
              const labels = (r.labels || []).map(x => x.name).join(', ');
              const state = r.status === 'online' ? (r.busy ? '🟡 online · busy' : '🟢 online · idle') : '🔴 ' + r.status;
              return '| ' + item.project + ' | ' + item.name + ' | ' + state + ' | ' + labels + ' |';
            });

            const runRows = Object.entries(workflowMap).map(([project, workflowName]) => {
              const r = allRuns.find(x => x.name === workflowName);
              if (!r) return '| ' + project + ' | - | ⚪ 없음 | - |';
              const icon = statusIcon(r.status, r.conclusion);
              const result = r.conclusion || r.status;
              const title = (r.display_title || '').replace(/\|/g, '/');
              return '| ' + project + ' | #' + r.run_number + ' · ' + title + ' | ' + icon + ' ' + result + ' | [열기](' + r.html_url + ') |';
            });

            const now = new Date().toLocaleString('ko-KR', {
              timeZone: 'Asia/Seoul',
              year: 'numeric', month: '2-digit', day: '2-digit',
              hour: '2-digit', minute: '2-digit', second: '2-digit',
              hour12: false
            });

            const consoleUrl = 'https://github.com/' + owner + '/' + repo + '/issues/new?template=khs-remote-console.yml';
            const actionsUrl = 'https://github.com/' + owner + '/' + repo + '/actions';

            const body = [
              '# KHS Remote Dashboard',
              '',
              '> 읽기 전용 상태판입니다. 이 대시보드 갱신은 로컬 프로젝트 파일을 수정하지 않습니다.',
              '',
              '**마지막 갱신:** ' + now + ' KST',
              '',
              '## Runner 상태',
              '',
              '| 프로젝트 | Runner | 상태 | Labels |',
              '|---|---|---|---|',
              ...runnerRows,
              '',
              '## 최근 작업',
              '',
              '| 프로젝트 | 최근 Run | 상태 | 링크 |',
              '|---|---|---|---|',
              ...runRows,
              '',
              '## 원격 실행',
              '',
              '- [📱 KHS Remote Console 열기](' + consoleUrl + ')',
              '- [⚙️ GitHub Actions 전체 보기](' + actionsUrl + ')',
              '',
              '### 안전 규칙',
              '',
              '- Mini-Jev / INDIE / AutoDirector는 각각 전용 runner lane을 사용합니다.',
              '- Codex 출력은 독립 검증 전 **NEEDS_VERIFICATION**입니다.',
              '- Antigravity/WebChat 요청은 실제 소비 전 **READY/QUEUED** 상태입니다.',
              '- 현재 INDIE 작업 중에는 Mini-Jev/콘솔 인프라 작업이 INDIE 로컬 파일을 수정하지 않습니다.'
            ].join('\n');

            await github.rest.issues.update({
              owner, repo, issue_number: dashboardIssue, body
            });
