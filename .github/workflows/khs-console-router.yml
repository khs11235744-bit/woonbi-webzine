name: KHS Console Router
on:
  issues:
    types: [opened]

permissions:
  contents: write
  actions: write
  issues: write

jobs:
  route:
    if: startsWith(github.event.issue.title, '[KHS Console]')
    runs-on: ubuntu-latest
    steps:
      - name: Route console request
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || '';
            const issueNumber = context.payload.issue.number;
            const actor = context.payload.issue.user.login;

            function field(label) {
              const escaped = label.replace(/[.*+?^$()|[\]{}\\]/g, '\\$&');
              const re = new RegExp('###\\s+' + escaped + '\\s*\\n\\n([\\s\\S]*?)(?=\\n###\\s+|$)');
              const m = body.match(re);
              return m ? m[1].trim() : '';
            }

            const project = field('[PROJECT] 프로젝트');
            const requestedAction = field('[ACTION] 작업');
            const selectedWorker = field('[WORKER] 워커');
            let prompt = field('[INSTRUCTION] 추가 지시');
            if (prompt === '_No response_') prompt = '';

            const now = new Date();
            const stamp = now.toISOString().replace(/[-:.TZ]/g, '').slice(0, 14);
            const projectSlug = project === 'Mini-Jev' ? 'minijev' : project === 'INDIE' ? 'indie' : 'autodirector';
            const requestId = 'console-' + projectSlug + '-' + issueNumber + '-' + stamp;

            let workflowId;
            let jobPath;
            let job = {
              request_id: requestId,
              issue_number: issueNumber,
              requested_by: actor,
              requested_at: now.toISOString(),
              console_action: requestedAction,
              console_worker: selectedWorker
            };

            const forceSidecar =
              requestedAction === 'Antigravity 보조 요청' ? 'antigravity' :
              requestedAction === 'WebChat 보조 요청' ? 'webchat' :
              selectedWorker === 'Antigravity' ? 'antigravity' :
              selectedWorker === 'WebChat' ? 'webchat' : null;

            const forceCodex = requestedAction === 'Codex 실행' || selectedWorker === 'Codex';

            if (project === 'Mini-Jev') {
              workflowId = 'khs-remote.yml';
              jobPath = 'KHS_REMOTE/minijev_jobs/' + requestId + '.json';
              job.project = 'KHS_MINI_JEV';
              if (requestedAction === '상태 확인') {
                job.action = 'snapshot_guard';
              } else if (forceSidecar) {
                job.action = 'sidecar_request';
                job.worker = forceSidecar;
                job.prompt = prompt;
              } else {
                job.action = 'minijev_codex';
                job.prompt = prompt || 'Read the real current KHS_MINI_JEV state and perform exactly one bounded next task. Preserve current local HEAD/dirty overlay, deterministic guard before learned routing, and do not claim PASS without real verification.';
              }
            } else if (project === 'INDIE') {
              workflowId = 'indie-remote.yml';
              jobPath = 'KHS_REMOTE/indie_jobs/' + requestId + '.json';
              job.project = 'INDIE';
              if (requestedAction === '상태 확인') {
                job.action = 'indieplus_status';
              } else if (forceSidecar) {
                job.action = 'sidecar_request';
                job.worker = forceSidecar;
                job.prompt = prompt;
              } else {
                job.action = 'indieplus_codex';
                job.prompt = prompt || 'Inspect the current INDIE local HEAD and dirty overlay. Perform one bounded task only, preserve existing work, run relevant checks, and leave the result for independent verification.';
                job.push_after = false;
              }
            } else if (project === 'AutoDirector') {
              workflowId = 'autodirector-remote.yml';
              jobPath = 'KHS_REMOTE/autodirector_jobs/' + requestId + '.json';
              if (requestedAction === '상태 확인') {
                job.action = 'autodirector_status';
              } else if (forceSidecar) {
                job.action = 'autodirector_sidecar_request';
                job.worker = forceSidecar;
                job.prompt = prompt;
              } else {
                job.action = 'autodirector_codex';
                job.prompt = prompt || 'Read the authoritative current AutoDirector state and perform exactly one bounded next task. Preserve the current local worktree and do not treat worker output as verified.';
              }
            } else {
              core.setFailed('Unknown project: ' + project);
              return;
            }

            const content = Buffer.from(JSON.stringify(job, null, 2), 'utf8').toString('base64');
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: jobPath,
              message: 'KHS_CONSOLE_TASK: ' + requestId,
              content,
              branch: 'main'
            });

            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: workflowId,
              ref: 'main',
              inputs: { job_path: jobPath }
            });

            const actionsUrl = 'https://github.com/' + context.repo.owner + '/' + context.repo.repo + '/actions';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body:
                '✅ **원격 작업을 큐에 넣었습니다.**\n\n' +
                '- Request: `' + requestId + '`\n' +
                '- Project: **' + project + '**\n' +
                '- Action: **' + requestedAction + '**\n' +
                '- Worker: **' + selectedWorker + '**\n' +
                '- Job: `' + jobPath + '`\n\n' +
                '[Actions 진행 상태 보기](' + actionsUrl + ')\n\n' +
                '> Codex는 검증 전 NEEDS_VERIFICATION, Antigravity/WebChat은 실제 완료 전 QUEUED로 남습니다.'
            });
