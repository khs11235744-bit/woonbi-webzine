name: AutoDirector Fast Probe
on:
  push:
    branches: [main]
    paths:
      - "KHS_REMOTE/autodirector_probe_jobs/**/*.json"

permissions:
  contents: write

concurrency:
  group: autodirector-fast-probe-v1
  cancel-in-progress: false

jobs:
  probe:
    runs-on: [self-hosted, Windows, X64, khs-minijev]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Resolve probe job
        id: job
        shell: powershell
        run: |
          $changed = @(& git diff-tree --no-commit-id --name-only -r $env:GITHUB_SHA)
          $job = $changed | Where-Object { $_ -like "KHS_REMOTE/autodirector_probe_jobs/*.json" } | Select-Object -First 1
          if (-not $job) { throw "AutoDirector probe job not found" }
          "job=$job" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Execute bounded probe
        shell: powershell
        run: |
          Set-ExecutionPolicy -Scope Process Bypass -Force
          $cmdPath = Join-Path $env:GITHUB_WORKSPACE ("${{ steps.job.outputs.job }}" -replace '/', '\')
          .\KHS_REMOTE\autodirector_dispatcher.ps1 -CmdPath $cmdPath
      - name: Commit probe result
        if: always()
        shell: powershell
        run: |
          git config user.name "KHS AutoDirector Runner"
          git config user.email "khs-autodirector-runner@users.noreply.github.com"
          git add KHS_REMOTE/autodirector_results
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 1) {
            git commit -m "AUTODIRECTOR_PROBE_RESULT: $env:GITHUB_RUN_ID"
            git pull --rebase origin main
            git push origin HEAD:main
          }
