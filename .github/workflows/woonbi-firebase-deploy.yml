name: Woonbi Firebase deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: woonbi-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check source
        run: |
          npm run check
          npm test
          npm run build

      - name: Authenticate to Google Cloud with OIDC
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/285370921993/locations/global/workloadIdentityPools/woonbi-github/providers/github
          service_account: woonbi-github-deploy@woonbi-webzine-2026.iam.gserviceaccount.com

      - name: Build live shell
        run: python3 scripts/build.py --live-config deploy/firebase-live-config.json

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@15.30.2

      - name: Deploy Woonbi only
        run: firebase deploy --project woonbi-webzine-2026 --only firestore,storage,hosting --non-interactive
