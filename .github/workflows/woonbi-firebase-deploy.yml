name: Woonbi Firebase deploy

on:
  workflow_dispatch:
    inputs:
      confirm_full_release:
        description: 'Publish a reviewed full release (school data refresh uses a separate preserving workflow)'
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: woonbi-production
  cancel-in-progress: true

jobs:
  deploy:
    if: inputs.confirm_full_release == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install project tooling
        run: npm ci

      - name: KHS DevCraft quality gate
        run: |
          npm run devcraft:gate:full
          npm run build

      - id: auth
        name: Authenticate to Google Cloud with OIDC
        uses: google-github-actions/auth@v3
        with:
          project_id: woonbi-webzine-2026
          workload_identity_provider: projects/285370921993/locations/global/workloadIdentityPools/woonbi-github/providers/github
          service_account: woonbi-github-deploy@woonbi-webzine-2026.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform

      - name: Build live shell
        run: python3 scripts/build.py --live-config deploy/firebase-live-config.json

      - name: Reject stale or sample-only full releases
        run: |
          test -f dist-live/js/feature-pohang-20261017.js
          test -f dist-live/js/feature-economy-2026.js
          test -f dist-live/js/feature-goldenbell-2026.js
          test -f dist-live/js/feature-research-20261021.js
          grep -q 'js/feature-research-20261021.js' dist-live/index.html

      - name: Refresh school life data
        env:
          NEIS_API_KEY: ${{ secrets.NEIS_API_KEY }}
        run: |
          node scripts/fetch-school-life.mjs
          node scripts/validate-school-life.cjs

      - name: Deploy Woonbi only
        env:
          FIREBASE_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: npx firebase deploy --project woonbi-webzine-2026 --only firestore,storage,hosting --non-interactive
