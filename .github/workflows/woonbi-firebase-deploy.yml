name: Woonbi Firebase deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: woonbi-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install project tooling
        run: npm ci

      - name: KHS DevCraft quality gate
        run: |
          npm run devcraft:gate:full
          npm run build

      - id: auth
        name: Authenticate to Google Cloud with OIDC
        uses: google-github-actions/auth@v3
        with:
          project_id: woonbi-webzine-2026
          workload_identity_provider: projects/285370921993/locations/global/workloadIdentityPools/woonbi-github/providers/github
          service_account: woonbi-github-deploy@woonbi-webzine-2026.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform

      - name: Build live shell
        run: python3 scripts/build.py --live-config deploy/firebase-live-config.json

      - name: Refresh school life data
        env:
          NEIS_API_KEY: ${{ secrets.NEIS_API_KEY }}
        run: |
          node scripts/fetch-school-life.mjs
          node scripts/validate-school-life.cjs

      - name: Deploy Woonbi only
        env:
          FIREBASE_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: npx firebase deploy --project woonbi-webzine-2026 --only firestore,storage,hosting --non-interactive
