name: Firebase credential capability probe

on:
  push:
    paths:
      - '.github/workflows/firebase-credential-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe configured credential names
        shell: bash
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          for n in FIREBASE_TOKEN FIREBASE_SERVICE_ACCOUNT GOOGLE_CREDENTIALS GCP_SA_KEY; do
            if [ -n "${!n}" ]; then
              echo "${n}=PRESENT"
            else
              echo "${n}=MISSING"
            fi
          done
