name: AutoDirector Direct Status
on:
  push:
    branches: [main]
    paths:
      - "KHS_REMOTE/autodirector_status_jobs/*.json"
permissions:
  contents: write
concurrency:
  group: autodirector-direct-status
  cancel-in-progress: true
jobs:
  status:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Read local AutoDirector status without modifying project
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $auto=Join-Path $env:USERPROFILE 'Documents\ChatGPT\동영상편집기 만들기'
          $changed=@(& git diff-tree --no-commit-id --name-only -r $env:GITHUB_SHA)
          $job=$changed|Where-Object{$_ -like 'KHS_REMOTE/autodirector_status_jobs/*.json'}|Select-Object -First 1
          if(-not $job){throw 'status job not found'}
          $req=Get-Content (Join-Path $env:GITHUB_WORKSPACE ($job -replace '/','\')) -Raw | ConvertFrom-Json
          function ReadShared([string]$p){
            if(-not(Test-Path $p)){return $null}
            $fs=[IO.File]::Open($p,[IO.FileMode]::Open,[IO.FileAccess]::Read,[IO.FileShare]::ReadWrite -bor [IO.FileShare]::Delete)
            try{$sr=New-Object IO.StreamReader($fs,[Text.Encoding]::UTF8,$true);try{return $sr.ReadToEnd()}finally{$sr.Dispose()}}finally{$fs.Dispose()}
          }
          $runningText=ReadShared (Join-Path $auto '.harness\RUNNING.json')
          $running=if($runningText){$runningText|ConvertFrom-Json}else{$null}
          $alive=$false;if($running -and $running.pid){$alive=$null-ne(Get-Process -Id([int]$running.pid)-ErrorAction SilentlyContinue)}
          $statusText=ReadShared (Join-Path $auto 'reports\harness\status.json')
          $todoText=ReadShared (Join-Path $auto 'WEBCHAT_TODO.md')
          $lastText=ReadShared (Join-Path $auto 'reports\harness\last-agent-message.md')
          $pkg=Get-Content (Join-Path $auto 'package.json') -Raw | ConvertFrom-Json
          $obj=[ordered]@{request_id=$req.request_id;captured_at=(Get-Date).ToString('o');version=$pkg.version;stop_present=(Test-Path(Join-Path $auto '.harness\STOP'));running=$running;running_pid_alive=$alive;status_json=$statusText;webchat_todo=$todoText;last_agent_message=$lastText}
          $outDir=Join-Path $env:GITHUB_WORKSPACE 'KHS_REMOTE\autodirector_results';New-Item -ItemType Directory -Force -Path $outDir|Out-Null
          $json=$obj|ConvertTo-Json -Depth 30
          [IO.File]::WriteAllText((Join-Path $outDir ($req.request_id+'.json')),$json,(New-Object Text.UTF8Encoding($false)))
      - name: Commit status result
        shell: powershell
        run: |
          git config user.name "KHS AutoDirector Runner"
          git config user.email "khs-autodirector-runner@users.noreply.github.com"
          git add KHS_REMOTE/autodirector_results
          git diff --cached --quiet
          if($LASTEXITCODE -eq 1){git commit -m "AUTODIRECTOR_STATUS: $env:GITHUB_RUN_ID";git pull --rebase origin main;git push origin HEAD:main}
