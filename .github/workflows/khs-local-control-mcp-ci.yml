name: KHS Local Control MCP CI

on:
  push:
    paths:
      - 'KHS_REMOTE/KHS_LOCAL_CONTROL_MCP/**'
      - '.github/workflows/khs-local-control-mcp-ci.yml'
  pull_request:
    paths:
      - 'KHS_REMOTE/KHS_LOCAL_CONTROL_MCP/**'
      - '.github/workflows/khs-local-control-mcp-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-smoke:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: KHS_REMOTE/KHS_LOCAL_CONTROL_MCP
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install --ignore-scripts
      - name: Syntax check
        run: npm run check
      - name: Smoke test
        run: npm test
      - name: Build portable package
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\build-portable.ps1
